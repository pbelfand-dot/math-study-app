/* HOOP LIFE — light, clean, phone-first.

   The shell is a fixed three-part frame: a title bar, a scrolling feed of the
   life so far, and a dock pinned to the bottom with four category buttons and
   the + in the middle. Only the feed scrolls, which is what makes the + always
   reachable with a thumb no matter how long the life gets. */

:root {
  color-scheme: light;

  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --ink: #101828;
  --ink-2: #344054;
  --muted: #667085;
  --line: #e2e7ef;

  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: #e8efff;
  --deep: #14306b;

  --good: #16a34a;
  --bad: #dc2626;
  --warn: #d97706;

  --happy: #f59e0b;
  --health: #16a34a;
  --smarts: #2563eb;
  --rep: #0d9488;
  --hype: #7c3aed;
  --grades: #2563eb;
  --chem: #db2777;
  --time: #0ea5e9;

  --t0: #98a2b3;
  --t1: #16a34a;
  --t2: #2563eb;
  --t3: #7c3aed;
  --t4: #d97706;
  --t5: #dc2626;

  --r: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Archivo', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.hidden { display: none !important; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.55; }

/* ---------- the frame ---------- */
.app {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  max-width: 560px; margin: 0 auto;
  background: var(--bg);
}

.topbar {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  background: var(--accent); color: #fff;
  padding: max(6px, env(safe-area-inset-top)) 8px 6px;
}
.brand { text-align: center; font-weight: 800; letter-spacing: 0.06em; font-size: 17px; }
.brand b { font-weight: 800; opacity: 0.72; }
.menu { display: grid; gap: 4px; place-content: center; height: 40px; }
.menu span { display: block; width: 18px; height: 2px; background: #fff; border-radius: 2px; }
.menu.spacer { visibility: hidden; }

/* ---------- who you are ---------- */
.idcard {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 9px 14px 10px;
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
}
.idcard .nm { font-size: 16px; font-weight: 750; color: var(--deep); line-height: 1.25; }
.idcard .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.idcard .stars { color: var(--warn); letter-spacing: 1px; }
.idcard .proj { font-weight: 700; }
.idcard .proj.good { color: var(--good); }
.idcard .proj.bad { color: var(--bad); }
.idcard .cash { text-align: right; }
.idcard .cash b { display: block; font-size: 16px; font-weight: 750; color: var(--good); }
.idcard .cash span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }


/* ---------- the feed ---------- */
.feed { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 16px; }
.yr { margin-bottom: 14px; }
.yr h3 {
  font-size: 14px; font-weight: 750; color: var(--accent); margin-bottom: 4px;
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
}
.yr h3 .meta { font-size: 11px; font-weight: 600; color: var(--muted); }
.yr .line { font-size: 13.5px; color: var(--ink-2); padding: 2px 0; }
.yr .line.good { color: var(--good); }
.yr .line.bad { color: var(--bad); }
.yr .box {
  font-size: 13px; font-weight: 650; color: var(--deep);
  background: var(--accent-soft); border-radius: 9px; padding: 7px 10px; margin: 5px 0;
}
.yr.now h3 { color: var(--ink); }
.yr.now { border-left: 3px solid var(--accent); padding-left: 10px; }
.empty { color: var(--muted); font-size: 13px; font-style: italic; }

/* ---------- the dock ---------- */
.dock-wrap {
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -2px 10px rgba(16, 24, 40, 0.06);
}
.dock {
  display: grid; grid-template-columns: repeat(5, 1fr);
  align-items: end; padding: 8px 6px 6px; gap: 2px;
}
.dock-btn {
  display: grid; justify-items: center; gap: 3px; padding: 6px 0 2px;
  min-width: 0; border-radius: 12px;
}
.dock-btn .ic {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 18px; line-height: 1;
}
.dock-btn .lb { font-size: 10.5px; font-weight: 650; color: var(--ink-2); }
.dock-btn:disabled { opacity: 0.4; }
.dock-btn[data-alert='true'] .ic { background: #fde8e8; box-shadow: 0 0 0 2px var(--bad) inset; }

/* The + itself: bigger than everything else and lifted above the bar, the way
   the button that advances the whole game should be. */
.age {
  justify-self: center; align-self: end;
  width: 76px; height: 76px; margin-top: -26px; border-radius: 50%;
  background: var(--good); color: #fff;
  display: grid; place-content: center; justify-items: center; gap: 0;
  border: 4px solid var(--surface);
  box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
}
.age .plus { font-size: 30px; line-height: 1; font-weight: 300; }
.age .lb { font-size: 11px; font-weight: 750; letter-spacing: 0.04em; }
.age:disabled { background: #b6c4dd; box-shadow: none; }
.age.decide { background: var(--accent); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
.age.decide .plus { font-size: 22px; }

/* ---------- the four bars ---------- */
.bars { padding: 2px 14px 10px; display: grid; gap: 5px; }
.bars .row { display: grid; grid-template-columns: 68px 1fr; gap: 9px; align-items: center; }
.bars .k { font-size: 11px; font-weight: 650; color: var(--ink-2); }
.bars .track { height: 13px; background: #e6ebf3; border-radius: 4px; overflow: hidden; position: relative; }
.bars .fill { height: 100%; border-radius: 4px; transition: width 0.35s ease; }
/* The percentage sits INSIDE the fill, in white, once the fill is wide enough
   to hold it — otherwise dark text on a full bar reads as a smudge on the
   colour. Below that it sits on the empty track instead. */
.bars .v {
  position: absolute; right: 6px; top: 0; line-height: 13px;
  font-size: 9.5px; font-weight: 750; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.bars .row.full .v { color: #fff; }
.bars .row.low .k::before { content: '⚠ '; color: var(--bad); }

/* ---------- the sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 40, 0.42); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; margin: 0 auto;
  max-height: 82vh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 30px rgba(16, 24, 40, 0.22);
  animation: up 0.18s ease;
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes up { from { transform: translateY(14px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: grid; grid-template-columns: 34px 1fr 34px; align-items: center;
  padding: 12px 12px 4px;
}
.sheet-head h2 { font-size: 16px; font-weight: 750; text-align: center; }
.sheet-head .back, .sheet-head .close { font-size: 24px; color: var(--muted); line-height: 1; height: 34px; }
/* Hidden by visibility, not display: the head is a three-column grid and
   collapsing the back button's column shunts the title out of the centre. */
.sheet-head .back.off { visibility: hidden; }
.sheet-hint { padding: 0 16px 8px; font-size: 12px; color: var(--muted); text-align: center; }
.sheet-body { overflow-y: auto; padding: 4px 12px 16px; display: grid; gap: 7px; }

/* ---------- an option row ---------- */
.opt {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
  width: 100%; min-width: 0; text-align: left;
  background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 11px 12px;
}
.opt:disabled { opacity: 0.5; }
.opt .t { display: block; font-size: 14px; font-weight: 700; }
.opt .d { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.opt .tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.02em; border-radius: 5px; padding: 2px 6px;
  background: var(--accent-soft); color: var(--accent);
}
.tag.time { background: #e0f2fe; color: #0369a1; }
.tag.cash { background: #dcfce7; color: #15803d; }
.tag.spend { background: #fef3c7; color: #b45309; }
.tag.no { background: #fee2e2; color: #b91c1c; }
/* What a session is worth, per attribute. `dim` is the same information saying
   there is nothing left in it. */
.tag.gain { background: #dcfce7; color: #15803d; }
.tag.dim { background: #eef1f6; color: var(--muted); }
.tag.wear { background: #ffedd5; color: #c2410c; }

/* A focused-training row carries its own progress bar. */
.opt.focus .t { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.opt.focus .num { font-variant-numeric: tabular-nums; color: var(--accent); }
.opt.focus .bar {

// Seedable RNG. Everything in the engine draws from an injected `rng` object so
// the daily seed and the Monte Carlo harness are reproducible.

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// An RNG handle: .random() plus the derived distributions the engine needs.
function makeRng(source) {
  const random = source || Math.random;
  let spare = null;
  const api = {
    random,
    // Box-Muller, cached spare.
    gauss(mean = 0, sd = 1) {
      if (spare !== null) {
        const v = spare;
        spare = null;
        return mean + sd * v;
      }
      let u = 0;
      let v = 0;
      let s = 0;
      do {
        u = random() * 2 - 1;
        v = random() * 2 - 1;
        s = u * u + v * v;
      } while (s >= 1 || s === 0);
      const mul = Math.sqrt((-2 * Math.log(s)) / s);
      spare = v * mul;
      return mean + sd * u * mul;
    },
    int(n) {
      return Math.floor(random() * n);
    },
    pick(arr) {
      return arr[Math.floor(random() * arr.length)];
    },
    chance(p) {
      return random() < p;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
  return api;
}

function seededRng(seedText) {
  return makeRng(mulberry32(hashString(String(seedText))));
}

/* ===== src/normal.js ===== */
// Normal tail probabilities.
//
// The roll curve needs P(Z > t) accurate far out in the tail — a Mythic pull is
// around 1 in a million, and the odds line quotes it — so this needs small
// RELATIVE error at large t, not just small absolute error. The usual
// Abramowitz-Stegun 7.1.26 polynomial is ~1e-7 absolute, which is worthless
// once the true value is 1e-9. This is the Chebyshev erfc from Numerical
// Recipes 3rd ed., which holds relative accuracy across the whole range.

const COF = [
  -1.3026537197817094, 6.4196979235649026e-1, 1.9476473204185836e-2,
  -9.561514786808631e-3, -9.46595344482036e-4, 3.66839497852761e-4,
  4.2523324806907e-5, -2.0278578112534e-5, -1.624290004647e-6,
  1.30365583558e-6, 1.5626441722e-8, -8.5238095915e-8,
  6.529054439e-9, 5.059343495e-9, -9.91364156e-10,
  -2.27365122e-10, 9.6467911e-11, 2.394038e-12,
  -6.886027e-12, 8.94487e-13, 3.13092e-13,
  -1.12708e-13, 3.81e-16, 7.106e-15,
];

function erfc(x) {
  const z = Math.abs(x);
  const t = 2 / (2 + z);
  const ty = 4 * t - 2;
  let d = 0;
  let dd = 0;
  for (let j = COF.length - 1; j > 0; j--) {
    const tmp = d;
    d = ty * d - dd + COF[j];
    dd = tmp;
  }
  const ans = t * Math.exp(-z * z + 0.5 * (COF[0] + ty * d) - dd);
  return x >= 0 ? ans : 2 - ans;
}

// P(Z > t) for standard normal Z.
const normalTail = (t) => 0.5 * erfc(t / Math.SQRT2);

// Inverse of normalTail: the t with P(Z > t) = p. Newton refinement on top of
// the Acklam-style rational start, so the seeded sampler can be pure inverse
// transform and consume exactly one uniform per magnitude.
function normalTailInv(p) {
  if (p <= 0) return Infinity;
  if (p >= 1) return -Infinity;
  // Rational approximation for the normal quantile (Wichura-style tails).
  const q = p < 0.5 ? p : 1 - p;
  const r = Math.sqrt(-2 * Math.log(q));
  let t =
    r -
    (2.30753 + 0.27061 * r) / (1 + (0.99229 + 0.04481 * r) * r);
  // Two Newton steps against the accurate tail: plenty for double precision.
  for (let i = 0; i < 3; i++) {
    const err = normalTail(t) - q;
    const pdf = Math.exp(-0.5 * t * t) / Math.sqrt(2 * Math.PI);
    if (pdf < 1e-300) break;
    t += err / pdf;
  }
  return p < 0.5 ? t : -t;
}

function rollArchetype(rng) {
  const r = rng.random();
  let acc = 0;
  for (const t of ARCHETYPE_TIERS) {
    acc += t.chance;
    if (r < acc) {
      if (t.tier === 'None') return null;
      const a = rng.pick(ROLLED_ARCHETYPES[t.tier]);
      return { ...a, tier: t.tier, color: t.color };
    }
  }
  return null;
}

// Resolve every gift mechanism for one attribute key.
// Returned `floor` is relative to the GIFTED expectation, because that is what
// rollStat is handed — the spec's floor is relative to the natural one.
function applyGift(archetype, key) {
  if (!archetype) return { boost: 0, sigmaMult: 1, floor: null };
  const boost = (archetype.boost?.[key] || 0) - (archetype.cost?.[key] || 0);
  const sigmaMult = archetype.sigmaMult?.[key] ?? 1;

  const specific = archetype.floor?.[key];
  const all = archetype.floor?.ALL;
  let floorNatural = null;
  if (specific !== undefined && all !== undefined) floorNatural = Math.max(specific, all);
  else if (specific !== undefined) floorNatural = specific;
  else if (all !== undefined) floorNatural = all;

  return {
    boost,
    sigmaMult,
    floor: floorNatural === null ? null : floorNatural - boost,
  };
}

// ---------------------------------------------------------------------------
// 5B — DERIVED ARCHETYPES, for the 70% who rolled nothing.
// ---------------------------------------------------------------------------

// Thresholds are percentiles of the rolled population, not round numbers.
// Measured medians: scoring 42, passing 41, defense 40, IQ 50. Anything phrased
// as "weak scoring" has to sit below 42 to mean weak, and a minimum-skill test
// can never fire at all, because the 25 floor puts a 25 on almost every build.
function deriveArchetype(b) {
  const s = b.skills;
  const m = b.mentals;
  const scoring = (s.three + s.midrange + s.finishing + s.dunk) / 4;
  const passing = (s.playmaking + s.handles) / 2;
  const defense = (s.perimeterD + s.interiorD + s.block) / 3;
  const skillVals = Object.values(s).sort((x, y) => x - y);
  const best = skillVals[skillVals.length - 1];
  // "No weak spots" needs two tests, not one. The single worst skill tests
  // nothing but the 25 floor, and the fourth-worst alone still lets a build with
  // three floored skills through. Genuinely hole-free is rare here (~1% of
  // balanced high-IQ builds) and The Engine should be rare to match.
  const fourthLowest = skillVals[3];
  const weakSpots = skillVals.filter((v) => v < 35).length;

  // Failure states first — a diagnosis outranks a description.
  if (b.mentality >= 64 && scoring <= 38) {
    return {
      title: 'The Chucker',
      tier: 'Derived',
      failure: true,
      color: '#ff6b6b',
      flavor: 'Wanted every shot. Could not make them.',
    };
  }
  if (b.mentality <= 36 && scoring >= 58) {
    return {
      title: 'The Ghost',
      tier: 'Derived',
      failure: true,
      color: '#ff6b6b',
      flavor: 'Had it the whole time and would not use it.',
    };
  }
  if (b.mentality <= 45 && passing >= 58) {
    return {
      title: 'The Conductor',
      tier: 'Derived',
      color: '#4c8dff',
      flavor: 'The offense runs through him and it hums.',
    };
  }
  if (defense >= 55 && scoring <= 45) {
    return {
      title: 'Glue',
      tier: 'Derived',
      color: '#3fb950',
      flavor: 'Does the parts of the job nobody claps for.',
    };
  }
  if (b.mentality >= 40 && b.mentality <= 62 && m.bballIQ >= 58 && fourthLowest >= 36 && weakSpots <= 3) {
    return {
      title: 'The Engine',
      tier: 'Derived',
      color: '#3fb950',
      flavor: 'Nothing to attack, nothing to scheme against. Never off the floor.',
    };
  }
  if (best < 75) {
    return {
      title: 'Rotation Guy',
      tier: 'Derived',
      color: '#8b93a1',
      flavor: 'Eight to twelve honest minutes a night.',
    };
  }
  return {
    title: 'Rotation Guy',
    tier: 'Derived',
    color: '#8b93a1',
    flavor: 'Useful. Never the reason you bought a ticket.',
  };
}

function titleFor(b) {
  return b.archetype ? b.archetype : deriveArchetype(b);
}

/* ===== src/roll.js ===== */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Half-normal magnitude by inverse transform, fair coin for direction, with a
// wider scale downward than upward. See the note in constants.js for why this
// replaced the original sqrt(-ln u) draw.
// The deviation is z * sigma, with a wider scale on the downward side. Written
// against a standard normal z rather than an explicit coin-flip-plus-magnitude:
// the two are identical in distribution (sign(z) is a fair coin, |z| is
// half-normal), but this form lets correlated z's be passed in, which is how
// skills travel together without disturbing any marginal.
function rollStat(expected, sigma, rng = defaultRng, floorRel = null, z = null) {
  const zz = z === null ? rng.gauss(0, 1) : z;
  let d = zz * sigma * (zz > 0 ? UP_SCALE : DOWN_SCALE);
  if (floorRel !== null && d < floorRel) d = floorRel;
  return clamp(Math.round(expected + d), STAT_FLOOR, STAT_CEIL);
}

// One draw of the shared talent factors. Held on the build, so a reroll
// redraws only that attribute's unique component — the player's underlying
// athleticism or shooting touch does not change because you rerolled his post.
function rollFactors(rng) {
  return Object.fromEntries(FACTORS.map((f) => [f, rng.gauss(0, 1)]));
}

// Skill driver: shared factors plus a unique component, scaled to unit variance
// so the marginal stays exactly standard normal.
function skillZ(b, key, rng) {
  const load = FACTOR_LOADINGS[key] || {};
  let shared = 0;
  let ss = 0;
  for (const [f, l] of Object.entries(load)) {
    shared += l * b.factors[f];
    ss += l * l;
  }
  return shared + Math.sqrt(Math.max(0, 1 - ss)) * rng.gauss(0, 1);
}

// P(rolling this high or higher), always against the NORMAL sigma — that is
// what makes a freak-gene pull read as absurd rather than merely lucky.
// Exactly at the expected value this returns 0.5, which is the point: the
// number on screen is the median, not a target you usually miss.
function rarityP(v, expected, sigma) {
  const d = v - expected;
  if (d >= 0) return UP_CHANCE * 2 * normalTail(d / (sigma * UP_SCALE));
  return 1 - (1 - UP_CHANCE) * 2 * normalTail(-d / (sigma * DOWN_SCALE));
}

function tierFor(p) {
  return RARITY_TIERS.find((t) => p > t.min) || RARITY_TIERS[RARITY_TIERS.length - 1];
}

function expectedSkill(key, heightInches, boost = 0) {
  const s = SKILLS[key];
  return s.base + (heightInches - BASE_HEIGHT) * s.growth + boost;
}

function formatHeight(inches) {
  return `${Math.floor(inches / 12)}'${inches % 12}"`;
}

function oddsText(p) {
  if (p >= 0.5) return `${Math.round(p * 100)}% or better`;
  const one = 1 / p;
  if (one < 1000) return `1 in ${Math.round(one)}`;
  if (one < 1e6) return `1 in ${Math.round(one / 100) / 10}k`;
  if (one < 1e9) return `1 in ${Math.round(one / 1e5) / 10}M`;
  return `1 in ${Math.round(one / 1e8) / 10}B`;
}

// ---------------------------------------------------------------------------
// Build construction. The UI walks this one beat at a time; the Monte Carlo
// harness calls rollCompleteBuild().
// ---------------------------------------------------------------------------

function startBuild(rng = defaultRng, opts = {}) {
  const height = clamp(Math.round(rng.gauss(78, 3.6)), 64, 90);
  const wingspan = height + Math.round(rng.gauss(2.5, 2.6));
  const frameIndex = clamp(Math.round(rng.gauss(2, 1)), 0, 4);
  const freak = opts.noFreak ? null : rng.chance(FREAK_CHANCE) ? rng.pick(SKILL_KEYS) : null;
  // Draft age and rawness are rolled here, not in the sim, so the build sheet
  // and the career agree on what draft night looked like.
  const draftAge = 19 + rng.int(4);
  const rawness = rng.gauss(0, 1.8);
  const scoutNoise = rng.gauss(0, 1); // scouts are wrong by a little, reproducibly

  return {
    rng,
    height,
    wingspan,
    frameIndex,
    frame: FRAMES[frameIndex],
    factors: rollFactors(rng),
    draftAge,
    rawness,
    scoutNoise,
    freakGene: freak,
    archetype: null, // filled by beat 3
    mentality: null, // filled by beat 4
    skills: {},
    skillMeta: {},
    physicals: {},
    physicalMeta: {},
    mentals: {},
    order: rng.shuffle(SKILL_KEYS),
    rerollsLeft: opts.rerolls ?? 3,
  };
}

function rollArchetypeBeat(b) {
  b.archetype = rollArchetype(b.rng);
  return b.archetype;
}

function rollMentalityBeat(b) {
  b.mentality = clamp(Math.round(b.rng.gauss(50, 21)), 0, 100);
  return b.mentality;
}

// Everything a gift can touch, resolved for one attribute.
function giftFor(b, key) {
  return applyGift(b.archetype, key);
}

function rollSkillBeat(b, key) {
  const s = SKILLS[key];
  const g = giftFor(b, key);
  const expectedNatural = expectedSkill(key, b.height);
  const expectedGifted = expectedNatural + g.boost;
  let sigma = s.sigma * g.sigmaMult;
  if (b.freakGene === key) sigma *= FREAK_MULT;

  const value = rollStat(expectedGifted, sigma, b.rng, g.floor, skillZ(b, key, b.rng));
  b.skills[key] = value;
  b.skillMeta[key] = {
    expectedNatural: Math.round(expectedNatural),
    expectedGifted: Math.round(expectedGifted),
    // Rarity is always judged against the natural expectation and normal sigma.
    p: rarityP(value, expectedNatural, s.sigma),
    freak: b.freakGene === key,
    gifted: g.boost !== 0 || g.sigmaMult !== 1 || g.floor !== null,
  };
  b.skillMeta[key].tier = tierFor(b.skillMeta[key].p);
  return b.skillMeta[key];
}

function rollPhysicalBeat(b, key) {
  const p = PHYSICALS[key];
  const g = giftFor(b, key);
  const expectedNatural = p.expected(b.height, b.frameIndex);
  const expectedGifted = expectedNatural + g.boost;
  const value = rollStat(expectedGifted, p.sigma * g.sigmaMult, b.rng, g.floor);
  b.physicals[key] = value;
  b.physicalMeta[key] = {
    expectedNatural: Math.round(expectedNatural),
    expectedGifted: Math.round(expectedGifted),
    p: rarityP(value, expectedNatural, p.sigma),
  };
  b.physicalMeta[key].tier = tierFor(b.physicalMeta[key].p);
  return b.physicalMeta[key];
}

function rollMentals(b) {
  for (const key of MENTAL_KEYS) {
    const m = MENTALS[key];
    const g = giftFor(b, key);
    b.mentals[key] = clamp(Math.round(b.rng.gauss(m.mean + g.boost, m.sd * g.sigmaMult)), 1, 99);
  }
  return b.mentals;
}

// The full ordered beat list the sequential UI walks.
function beatPlan(b) {
  return [
    { kind: 'height' },
    { kind: 'body' },
    { kind: 'archetype' },
    { kind: 'mentality' },
    ...b.order.map((key) => ({ kind: 'skill', key })),
    ...PHYSICAL_KEYS.map((key) => ({ kind: 'physical', key })),
    // Last, because it is read off everything above it.
    { kind: 'potential' },
  ];
}

function rollCompleteBuild(rng = defaultRng, opts = {}) {
  const b = startBuild(rng, opts);
  if (opts.noArchetypes) b.archetype = null;
  else rollArchetypeBeat(b);
  rollMentalityBeat(b);
  for (const key of b.order) rollSkillBeat(b, key);
  for (const key of PHYSICAL_KEYS) rollPhysicalBeat(b, key);
  rollMentals(b);
  return b;
}

/* ===== src/overall.js ===== */
// Position is read off height. It only decides which skills the composite cares
// about — it is not a rating.
const POSITIONS = [
  { name: 'Point Guard', short: 'PG', maxHeight: 73 },
  { name: 'Shooting Guard', short: 'SG', maxHeight: 77 },
  { name: 'Wing', short: 'WING', maxHeight: 80 },
  { name: 'Forward', short: 'FWD', maxHeight: 83 },
  { name: 'Center', short: 'C', maxHeight: 999 },
];

function positionFor(height) {
  return POSITIONS.find((p) => height <= p.maxHeight);
}

// Unnormalised weights, normalised at use. Concentrated rather than flat: a
// point guard's rating should live and die on playmaking, handles and shooting,
// and a centre's on interior defence and rebounding. Spreading weight evenly
// across twelve attributes makes every position rate the same player the same
// way, which is how a 7-footer's handle ends up mattering as much as his rim
// protection.
const WEIGHTS = {
  PG: { playmaking: 22, handles: 18, three: 14, speed: 13, perimeterD: 9, midrange: 8, finishing: 8, rebounding: 4, dunk: 2, interiorD: 2, post: 1, block: 1 },
  SG: { three: 20, midrange: 13, handles: 11, speed: 11, perimeterD: 11, finishing: 10, playmaking: 9, dunk: 6, rebounding: 5, interiorD: 2, block: 1, post: 1 },
  WING: { three: 16, finishing: 13, perimeterD: 13, midrange: 11, speed: 9, dunk: 8, rebounding: 8, handles: 8, playmaking: 7, interiorD: 4, block: 2, post: 1 },
  FWD: { rebounding: 15, interiorD: 14, finishing: 13, three: 11, post: 10, dunk: 10, block: 9, midrange: 7, perimeterD: 6, speed: 3, playmaking: 1, handles: 1 },
  C: { interiorD: 19, rebounding: 18, block: 15, finishing: 13, post: 12, dunk: 9, midrange: 5, three: 4, perimeterD: 3, speed: 1, playmaking: 1, handles: 0 },
};

function fitFor(b) {
  const s = b.skills;
  const scoring = (s.three + s.midrange + s.finishing + s.dunk) / 4;
  const passing = (s.playmaking + s.handles) / 2;
  return ((b.mentality - 50) / 50) * ((scoring - passing) / 40);
}

// Raw composite, before calibration. Deliberately small wingspan contribution —
// the old build let it push everyone into the 70s.
function rawComposite(b) {
  const pos = positionFor(b.height);
  const w = WEIGHTS[pos.short];
  let sum = 0;
  let total = 0;
  for (const [k, weight] of Object.entries(w)) {
    sum += b.skills[k] * weight;
    total += weight;
  }
  let raw = sum / total;

  const wingDiff = b.wingspan - b.height;
  raw += clamp(wingDiff - 2.5, -4, 6) * 0.35;

  // Physicals matter, but a little.
  raw += (b.physicals.stamina - 50) * 0.04;
  raw += (b.physicals.durability - 50) * 0.02;

  // Fit feeds peak overall.
  raw += fitFor(b) * 7;

  return raw;
}

// Empirical raw -> percentile, then percentile -> overall through the anchors.
function interp(table, x) {
  if (x <= table[0][0]) return table[0][1];
  const last = table[table.length - 1];
  if (x >= last[0]) return last[1];
  for (let i = 1; i < table.length; i++) {
    const [x1, y1] = table[i];
    const [x0, y0] = table[i - 1];
    if (x <= x1) return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0);
  }
  return last[1];
}

function rawToPercentile(raw) {
  return interp(RAW_QUANTILES, raw);
}

function percentileToOverall(p) {
  return interp(OVERALL_ANCHORS, p);
}

// Inverse of the anchor curve: where a rating sits in the build population.
function overallToPercentile(ov) {
  const flipped = OVERALL_ANCHORS.map(([p, o]) => [o, p]);
  return interp(flipped, ov);
}

// Where a scout-hype number sits in the class. Measured, not derived — hype
// carries SCOUT_NOISE variance on top of overall, so the overall anchors do not
// describe it and using them packs everyone into the lottery.
function hypeToPercentile(h) {
  return interp(HYPE_QUANTILES, h);
}

// What the build is worth at its PRIME, if it develops. This is the number the
// rolled attributes describe.
function potentialFor(b) {
  const raw = rawComposite(b);
  const p = rawToPercentile(raw);
  return clamp(Math.round(percentileToOverall(p)), 10, 99);
}

// What he is on draft night. Always below potential, and further below it the
// higher the ceiling — a nineteen-year-old with star tools is further from
// using them than a twenty-two-year-old who is already what he will be. That
// gap is the whole reason draft classes are a gamble.
function draftOverallFor(b) {
  const pot = potentialFor(b);
  const gap = clamp((pot - 50) * 0.45 + (21 - b.draftAge) * 1.8 + b.rawness, 1, 28);
  return clamp(Math.round(pot - gap), 20, 99);
}

// What the scouts put on the report: a potential GRADE on the attribute scale,
// not the ceiling itself. It tracks the true ceiling but is neither equal to it
// nor certain — scouting is a projection, and the number you are shown is the
// projection, so a build's real prime stays a question until it is played out.
function potentialGrade(b) {
  const pot = potentialFor(b);
  const scouted = 35 + (pot - 45) * 1.35 + (b.scoutNoise ?? 0) * 4;
  return clamp(Math.round(scouted), 25, 99);
}

// Kept as the build's headline number = its ceiling.
const overallFor = potentialFor;

// ---------------------------------------------------------------------------
// Build rarity. Multiplying every above-expectation probability swung wildly;
// this sums surprisal across the 12 skills and buckets it into a named tier.
// ---------------------------------------------------------------------------
// Surprisal, weighted toward the spikes. A flat sum across all twelve skills
// lets a broadly mediocre build outscore one with a genuine Elite pull, because
// eleven slightly-above-expectation rolls add up faster than one enormous one —
// which is how a 98 playmaking ends up labelled a Common build. The top three
// carry full weight and the rest are discounted, so a chase pull reads as one.
function buildRarityScore(b) {
  const s = Object.keys(b.skills)
    .map((key) => -Math.log(Math.max(b.skillMeta[key].p, 1e-12)))
    .sort((x, y) => y - x);
  const top = s.slice(0, 3).reduce((a, v) => a + v, 0);
  const rest = s.slice(3).reduce((a, v) => a + v, 0);
  return top + rest * 0.3;
}

function buildRarityTier(b) {
  const q = rawToPercentile(rawComposite(b));
  const name = BUILD_TIER_CUTS.find(([cut]) => q >= cut)[1];
  return { name, score: q, color: RARITY_TIERS.find((t) => t.name === name).color };
}

/* ===== src/people.js ===== */
// The people in a life, and what they are worth to you.
//
// Relationships are not flavour here. Teammates who like you feed you the ball;
// a coach who does not trust you does not play you; parents with money are the
// difference between going to the camp and hearing about it. Each one is a
// number between 0 and 100 that other systems read, so time spent on a person
// is time not spent in a gym and the trade has to be real in both directions.




// Roles, and roughly what each one controls.
const ROLES = {
  father: { label: 'Father', group: 'Family' },
  mother: { label: 'Mother', group: 'Family' },
  sibling: { label: 'Sibling', group: 'Family' },
  coach: { label: 'Coach', group: 'Basketball' },
  teammate: { label: 'Teammate', group: 'Basketball' },
  trainer: { label: 'Trainer', group: 'Basketball' },
  friend: { label: 'Best friend', group: 'Social' },
  partner: { label: 'Partner', group: 'Social' },
  agent: { label: 'Agent', group: 'Business' },
};

// Ids are handed out from a counter on the life itself. A module-level counter
// would restart at zero on page load and collide with the ids already inside a
// life restored from storage.
function makePerson(life, role, rng, over = {}) {
  life.nextPersonId = (life.nextPersonId || 0) + 1;
  return {
    id: `p${life.nextPersonId}`,
    role,
    name: randomName(rng),
    rel: clamp(Math.round(rng.gauss(52, 14)), 5, 95),
    alive: true,
    met: 0,
    ...over,
  };
}

// Starting cast. Not everyone gets everyone — a life where both parents are
// around and have money is a different game from one where neither is, and the
// point of rolling it is that you do not choose.
function rollCast(life, rng) {
  const people = [];
  const surname = life.name.split(' ').slice(1).join(' ');
  const family = (role) => {
    const p = makePerson(life, role, rng);
    p.name = `${p.name.split(' ')[0]} ${surname}`;
    return p;
  };

  if (rng.chance(0.94)) people.push(family('mother'));
  if (rng.chance(0.71)) people.push(family('father'));
  if (rng.chance(0.55)) people.push(family('sibling'));
  if (rng.chance(0.8)) people.push(makePerson(life, 'friend', rng));

  people.push(makePerson(life, 'coach', rng, { rel: clamp(Math.round(rng.gauss(46, 12)), 10, 85) }));
  for (let i = 0; i < 3; i++) {
    people.push(makePerson(life, 'teammate', rng, { rel: clamp(Math.round(rng.gauss(50, 16)), 5, 95) }));
  }
  return people;
}

// A new school means a new locker room. Family, friends and anyone you pay to
// be there come with you; the coach and every teammate do not.
function newRoster(life, rng) {
  const kept = life.people.filter((p) => p.role !== 'coach' && p.role !== 'teammate');
  const fresh = [makePerson(life, 'coach', rng, { rel: clamp(Math.round(rng.gauss(44, 12)), 10, 85) })];
  for (let i = 0; i < 4; i++) {
    fresh.push(makePerson(life, 'teammate', rng, { rel: clamp(Math.round(rng.gauss(46, 15)), 5, 95) }));
  }
  return [...kept, ...fresh];
}

const peopleIn = (life, role) => life.people.filter((p) => p.role === role && p.alive);
const personIn = (life, role) => peopleIn(life, role)[0] || null;
const personById = (life, id) => life.people.find((p) => p.id === id) || null;

// How the locker room reads you. This is the number the season uses: a team
// that likes you gets you the ball, and one that does not leaves you standing
// in the corner regardless of how good you are.
function teamChemistry(life) {
  const mates = peopleIn(life, 'teammate');
  if (!mates.length) return 50;
  return mates.reduce((a, p) => a + p.rel, 0) / mates.length;
}

const coachTrust = (life) => personIn(life, 'coach')?.rel ?? 50;

function nudge(person, amount) {
  if (!person) return person;
  person.rel = clamp(Math.round(person.rel + amount), 0, 100);
  return person;
}

// Relationships decay if you never spend anything on them. Not fast — this is
// a year passing, not a week — but enough that a locker room you have ignored
// for four years is not the one you walked into.
function driftRelationships(life, rng) {
  for (const p of life.people) {
    if (!p.alive) continue;
    const touched = p.met > 0;
    p.met = 0;
    const pull = touched ? 1.5 : -4;
    nudge(p, pull + rng.gauss(0, 2.5));
  }
}

//
// Two kinds. A PASSIVE event just happens and lands in the year's log: a scout
// turns up, a mixtape catches, your father loses his job. A CHOICE event stops
// the year and asks — take the booster's envelope or don't, play through the
// ankle or sit — and the branches genuinely diverge, including the ones where
// the obviously correct answer costs you something anyway.
//
// Every event carries a `when` so the table reads your actual situation rather
// than firing at random. A recruiting letter needs somebody to have heard of
// you. A transfer pitch needs you to be buried. The academic scandal needs you
// to have been cutting corners. Weight is how often it comes up once it is
// eligible, so the common ones stay common without the rare ones being
// impossible.





// Prefixed because the bundler flattens every module into one scope and a
// generic private helper name collides with the identical one next door.
const evCash = (n) => `$${Math.round(n).toLocaleString()}`;
const hs = (l) => l.stage === 'highschool';
const col = (l) => l.stage === 'college';

// Nudge hype with the same diminishing return the season uses, so an event can
// never do what a whole year of production cannot.
const hype = (l, n) => { l.meters.hype = clamp(l.meters.hype + n * (1 - l.meters.hype / 115), 0, 100); };
const rep = (l, n) => { l.meters.rep = clamp(l.meters.rep + n, 0, 100); };
const happy = (l, n) => { l.stats.happiness = clamp(l.stats.happiness + n, 0, 100); };
const health = (l, n) => { l.stats.health = clamp(l.stats.health + n, 0, 100); };
const smarts = (l, n) => { l.stats.smarts = clamp(l.stats.smarts + n, 0, 100); };
const grades = (l, n) => { l.meters.grades = clamp(l.meters.grades + n, 0, 100); };
const stock = (l, n) => { l.stock = clamp(l.stock + n, -40, 40); };

// Push an attribute toward its genetic ceiling by a share of what is left, so a
// windfall on a maxed-out skill is correctly worth almost nothing.
function bump(life, keys, share) {
  for (const k of keys) {
    const room = life.build.skills[k] - life.attrs[k];
    if (room > 0) life.attrs[k] = clamp(life.attrs[k] + room * share, 20, 99);
  }
}
const evStrongest = (l) => [...SKILL_KEYS].sort((a, b) => l.attrs[b] - l.attrs[a])[0];
const evWeakest = (l) => [...SKILL_KEYS].sort((a, b) => (l.build.skills[a] - l.attrs[a]) - (l.build.skills[b] - l.attrs[b])).at(-1);

// ---------------------------------------------------------------------------
// Rolling a year
// ---------------------------------------------------------------------------
function pickWeighted(pool, rng) {
  const total = pool.reduce((a, e) => a + e.weight, 0);
  let r = rng.random() * total;
  for (const e of pool) { r -= e.weight; if (r <= 0) return e; }
  return pool[pool.length - 1];
}

// Two to four things happen in a year, and one of them can be a question. The
// same event cannot fire twice in one year, and `seen` keeps the once-in-a-life
// beats from repeating.
function rollYearEvents(life, rng) {
  const passive = [];
  const seen = life.seenEvents || (life.seenEvents = []);
  const ONCE = new Set(['partner', 'newfriend', 'moved', 'academic']);

  let pool = EVENTS.filter((e) => (!ONCE.has(e.id) || !seen.includes(e.id)) && e.when(life));
  const n = 2 + (rng.chance(0.45) ? 1 : 0) + (rng.chance(0.18) ? 1 : 0);
  for (let i = 0; i < n && pool.length; i++) {
    const e = pickWeighted(pool, rng);
    pool = pool.filter((x) => x.id !== e.id);
    seen.push(e.id);
    const line = e.run(life, rng);
    if (line) passive.push(line);
  }

  // The question, if there is one to ask.
  let choice = null;
  if (rng.chance(0.62)) {
    const cpool = CHOICES.filter((c) => !seen.includes(c.id) && c.when(life));
    if (cpool.length) {
      const c = pickWeighted(cpool, rng);
      seen.push(c.id);
      choice = { id: c.id, title: c.title, text: c.text(life), options: c.options.map((o) => o.label) };
      life.pendingChoice = c.id;
    }
  }
  return { passive, choice };
}

function resolveChoice(life, choiceId, optionIndex, rng) {
  const c = CHOICES.find((x) => x.id === choiceId);
  life.pendingChoice = null;
  if (!c) return null;
  const opt = c.options[optionIndex];
  if (!opt) return null;
  return opt.run(life, rng) || { kind: 'note', text: opt.label };
}

/* ===== src/actions.js ===== */
// What you can do with a year.
//
// The old design put every option on one screen as a fixed list of slots, which
// made the whole game visible at a glance and therefore solvable at a glance.
// This replaces it with a time budget and a catalogue where most entries are
// CONDITIONAL: an action only appears when your situation calls for it. You do
// not see "Apologise to the coach" until you have a coach who is angry with
// you, or "Take a redshirt" until you are buried on a bench. Finding out that an
// option exists is part of the game, the same way it is in life.
//
// Four categories, matching the four buttons around the + in the UI.
//
// There is no time budget. Every action can be taken once a year and that is the
// only bookkeeping — an abstract "42% of the year" tax on each button turned
// every decision into arithmetic. What actually limits a year is the same set of
// things that limits a real one: money, a body that accumulates wear and then
// breaks, grades that decay while you are in the gym, and people who drift if
// you never turn up. Doing everything is allowed. It is just a good way to blow
// out a knee.





const CATEGORIES = [
  { id: 'train', name: 'Train', hint: 'The gym. Where the ability comes from.' },
  { id: 'school', name: 'School', hint: 'Eligibility, and the mind the game runs on.' },
  { id: 'people', name: 'People', hint: 'Everyone who decides something about you.' },
  { id: 'life', name: 'Life', hint: 'Money, health, exposure, and being a person.' },
];

// Named for its module. Every module's top level shares one scope once the
// bundler flattens them, so a generic private helper name is a landmine.
const cash = (n) => `$${Math.round(n).toLocaleString()}`;
const isCollege = (l) => l.stage === 'college';
const isHS = (l) => l.stage === 'highschool';

// How much of the remaining gap ONE session closes, before diminishing returns.
// Work ethic and the hidden talent slider both scale it, a trainer or a college
// staff multiplies it, and none of the three are things you can read off the
// screen while you are deciding.
function trainRate(life, mult = 1) {
  return (
    0.155 *
    (0.55 + life.mentals.workEthic / 110) *
    (0.62 + (life.talent ?? 50) / 130) *
    (life.program?.development ?? 1) *
    (personIn(life, 'trainer') ? 1.22 : 1) *
    mult
  );
}

// The fourth session on the same attribute in the same year is worth nothing.
// This is what stops "train the same number every year" from being the whole
// game, and it is stated in the UI rather than left to be discovered.
const REPEAT_FALLOFF = [1, 0.5, 0.2, 0];
const sessionsLeft = (life, key) =>
  Math.max(0, REPEAT_FALLOFF.length - 1 - (life.trainCounts?.[key] || 0));
const falloffFor = (life, key) =>
  REPEAT_FALLOFF[Math.min(life.trainCounts?.[key] || 0, REPEAT_FALLOFF.length - 1)];

// What a session would actually add, in attribute points, right now. Returned
// so the option can say so before it is taken instead of after.
function previewGain(life, key, weight = 1, mult = 1) {
  const room = life.build.skills[key] - life.attrs[key];
  if (room <= 0) return 0;
  return room * trainRate(life, mult) * weight * falloffFor(life, key);
}

function trainSkills(life, weights, mult = 1) {
  const moved = [];
  for (const [k, w] of Object.entries(weights)) {
    const gain = previewGain(life, k, w, mult);
    life.trainCounts[k] = (life.trainCounts[k] || 0) + 1;
    if (gain <= 0) continue;
    life.attrs[k] = clamp(life.attrs[k] + gain, 20, 99);
    moved.push(k);
  }
  return moved;
}

const weakest = (life, n) =>
  [...SKILL_KEYS]
    .sort((a, b) => life.build.skills[b] - life.attrs[b] - (life.build.skills[a] - life.attrs[a]))
    .slice(0, n);

      l.stock = clamp(l.stock + 5, -40, 40);
      return { kind: 'good', text: 'Signed with an agency. Somebody is working the phones for you now.' };
    },
  },
  {
    id: 'transfer', cat: 'life', name: 'Enter the transfer portal', blurb: 'This is not working.',
    price: 0,
    show: (l) => isCollege(l) && l.age >= 19 && l.lastMinutes < 12,
    run: (l, rng) => {
      l.wantsTransfer = true;
      return { kind: 'note', text: 'Put your name in the portal. Somewhere else, then.' };
    },
  },
];

// ---------------------------------------------------------------------------
// Focused training
//
// The grouped sessions above are what a team does with you. This is what you do
// on your own: pick one attribute and work it. Repeatable, unlike everything
// else, because the limit here is the falloff rather than a once-a-year rule —
// a second session on the same number is worth half, a third a fifth, and a
// fourth is worth nothing at all.
// ---------------------------------------------------------------------------
function focusActions(life) {
  return SKILL_KEYS.map((k) => {
    const left = sessionsLeft(life, k);
    const room = life.build.skills[k] - life.attrs[k];
    return {
      id: `focus:${k}`,
      cat: 'train',
      key: k,
      name: SKILLS[k].label,
      wear: 7,
      price: 0,
      trains: { [k]: 1 },
      focus: true,
      now: Math.round(life.attrs[k]),
      gain: previewGain(life, k, 1),
      left,
      maxed: room <= 0.5,
      run: (l) => {
        const before = l.attrs[k];
        trainSkills(l, { [k]: 1 });
        const moved = l.attrs[k] - before;
        if (moved < 0.05) {
          return { kind: 'note', text: `Another session on ${SKILLS[k].label.toLowerCase()}. Nothing left in it this year.` };
        }
        return { kind: 'note', text: `Worked ${SKILLS[k].label.toLowerCase()} on your own. +${moved.toFixed(1)}.` };
      },
    };
  });
}

// ---------------------------------------------------------------------------
// People actions
//
// Built per person rather than listed, because what you can do with somebody
// depends on who they are and how things currently stand between you.
// ---------------------------------------------------------------------------
function actionsForPerson(life, p) {
  const out = [];
  const push = (id, name, run, price = 0) => out.push({ id, name, price, run, person: p.id });

  push('talk', 'Spend time together', (l, rng) => {
    nudge(p, 4 + rng.int(5));
    p.met++;
    l.stats.happiness = clamp(l.stats.happiness + 2, 0, 100);
    return { kind: 'note', text: `Spent some time with ${p.name}.` };
  });

  if (p.rel < 45) {
    push('mend', 'Try to patch things up', (l, rng) => {
      p.met++;
      if (rng.chance(0.62)) {
        nudge(p, 12 + rng.int(9));
        return { kind: 'good', text: `Cleared the air with ${p.name}.` };
      }
      nudge(p, -4);
      return { kind: 'bad', text: `Tried to talk to ${p.name}. It went badly.` };
    });
  }

  if (p.role === 'teammate') {
    push('runit', 'Get in the gym together', (l, rng) => {
      p.met++;
      nudge(p, 7 + rng.int(6));
      trainSkills(l, Object.fromEntries(weakest(l, 2).map((k) => [k, 0.45])));
      return { kind: 'note', text: `Worked out with ${p.name}. Both of you got better.` };
    });
    if (p.rel < 35) {
      push('confront', 'Have it out with him', (l, rng) => {
        p.met++;
        if (rng.chance(0.4)) {
          nudge(p, 18);
          return { kind: 'good', text: `You and ${p.name} finally said it out loud. It helped.` };
        }
        nudge(p, -14);
        l.meters.rep = clamp(l.meters.rep - 4, 0, 100);
        return { kind: 'bad', text: `It got heard outside the locker room. That was a mistake.` };
      });
    }
  }

  if (p.role === 'coach') {
    push('minutes', 'Ask for more minutes', (l, rng) => {
      p.met++;
      // Asking works when he already rates you and backfires when he does not,
      // which is the entire lesson about asking for things.
      if (rng.chance(0.25 + p.rel / 220)) {
        l.minutesPitch = true;
        nudge(p, 3);
        return { kind: 'good', text: 'The coach heard you out and said he would look at it.' };
      }
      nudge(p, -9);
      return { kind: 'bad', text: 'You asked for minutes. He did not take it well.' };
    });
    push('extra', 'Stay after every practice', (l, rng) => {
      p.met++;
      nudge(p, 9 + rng.int(6));
      trainSkills(l, Object.fromEntries(weakest(l, 3).map((k) => [k, 0.4])));
      return { kind: 'good', text: 'Last one out of the gym, all year. He noticed.' };
    });
  }

  if (p.role === 'mother' || p.role === 'father') {
    const pot = Math.round(300 + life.background.yearly * 0.6);
    push('askmoney', `Ask for money`, 3, (l, rng) => {
      p.met++;
      if (rng.chance(0.35 + p.rel / 200)) {
        const got = Math.round(pot * (0.5 + rng.random()));
        l.money += got;
        nudge(p, -3);
        return { kind: 'good', text: `${p.name} gave you ${cash(got)}.` };
      }
      return { kind: 'bad', text: `Asked ${p.name} for money. There is not any.` };
    });
  }

  if (p.role === 'trainer') {
    push('session', 'Extra sessions all summer', (l) => {
      p.met++;
      nudge(p, 5);
      trainSkills(l, Object.fromEntries(weakest(l, 3).map((k) => [k, 0.8])), 1.15);
      l.strain += 12;  // declared inline: person actions are built, not listed
      return { kind: 'good', text: `A summer of extra work with ${p.name}.` };
    }, 900);
  }

  if (p.role === 'agent') {
    push('push', 'Have them work the phones', (l, rng) => {
      p.met++;
      l.stock = clamp(l.stock + 3 + rng.int(4), -40, 40);
      return { kind: 'good', text: `${p.name} spent the spring selling you to front offices.` };
    });
  }

  if (p.role === 'friend' || p.role === 'partner' || p.role === 'sibling') {
    push('lean', 'Lean on them', (l) => {
      p.met++;
      nudge(p, 5);
      l.stats.happiness = clamp(l.stats.happiness + 9, 0, 100);
      return { kind: 'good', text: `Talked to ${p.name} when it was heavy. It helped.` };
    });
  }

  return out;
}

// ---------------------------------------------------------------------------
// Availability and execution
// ---------------------------------------------------------------------------
// Everything is once a year. `once` is gone as a flag because it is now the
// rule; an already-taken action disappears from the list rather than sitting
// there greyed out.
function availableActions(life, cat) {
  return ACTIONS.filter((a) => {
    if (a.cat !== cat) return false;
    if (life.doneThisYear.includes(a.id)) return false;
    if (a.show && !a.show(life)) return false;
    return true;
  });
}

// Whether it can be taken right now, and if not, why. Money is the only hard
// block left; wear is a consequence, not a gate, so the game lets you do the
// stupid thing and then charges you for it.
function blockedReason(life, a) {
  if ((a.price || 0) > life.money) return `Costs ${cash(a.price)}`;
  return null;
}

// A warning, not a refusal. Shown on anything physical once the body has had
// enough, so the cost of a sixth session in one year is legible before you take
// it rather than after the knee goes.
function strainWarning(life, a) {
  if (!a.wear) return null;
  if (life.strain + a.wear > 78) return 'Your body has had enough';
  if (life.strain + a.wear > 55) return 'Getting worn down';
  return null;
}

function doAction(life, a, rng) {
  if (blockedReason(life, a)) return null;
  life.money -= a.price || 0;
  life.strain += a.wear || 0;
  const entry = a.run(life, rng) || { kind: 'note', text: a.name };
  life.doneThisYear.push(a.id);
  life.yearLog.push(entry);
  return entry;
}

/* ===== src/career.js ===== */
const round1 = (v) => Math.round(v * 10) / 10;

// ---------------------------------------------------------------------------
// Draft
// ---------------------------------------------------------------------------
function runDraft(b, draftOvr, potential, rng) {
  // Scouts weigh projected upside above present ability — which is why a raw
  // nineteen-year-old goes ahead of a finished twenty-two-year-old who is better
  // today, and why the top of a lottery is mostly unfinished players. It is
  // still scouting and not truth, so reaches and steals both happen.
  const hype = draftOvr * 0.35 + potential * 0.65 + rng.gauss(0, SCOUT_NOISE);
  const guaranteed = !!b.archetype?.guaranteesDraft;

  if (hype < DRAFT_CUTOFF && !guaranteed) {
    const signChance = clamp((hype - 46) / 52, 0, 0.42);
    return { drafted: false, pick: null, hype, signed: rng.chance(signChance), guaranteed: false };
  }

  // A pick is a rank inside the class: spread everyone above the cutoff across
  // the 60 picks, by measured hype percentile.
  const q = hypeToPercentile(hype);
  const cutoffQ = hypeToPercentile(DRAFT_CUTOFF);
  const frac = clamp((q - cutoffQ) / (1 - cutoffQ), 0, 1);
  let pick = Math.round(60 - frac * 59);
  if (guaranteed) pick = Math.min(pick, 60);
  pick = clamp(pick, 1, 60);
  return { drafted: true, pick, hype, signed: true, guaranteed };
}

// ---------------------------------------------------------------------------
// Injuries
// ---------------------------------------------------------------------------
const INJURY_KINDS = {
  minor: ['ankle sprain', 'hand contusion', 'sore knee', 'hip pointer', 'strained calf'],
  major: ['stress fracture', 'torn meniscus', 'high ankle sprain', 'shoulder labrum', 'plantar fascia tear'],
  severe: ['torn ACL', 'ruptured achilles', 'micro-fracture surgery', 'compound leg fracture', 'severe back injury'],
};

function injuryRoll(b, state, minutes, eff, rng) {
  const dur = b.physicals.durability;
  // A tall, slight frame carries a body it was not built to carry.
  const mismatch = Math.max(0, (b.height - 78) * 0.015 - (b.frameIndex - 2) * 0.03);
  const p = clamp(
    0.15 *
      (1 + (58 - dur) / 60) *
      (1 + mismatch) *
      (1 + Math.max(0, state.age - 29) * 0.06) *
      (0.55 + (minutes / 34) * 0.6) *
      (1 + 0.3 * state.injuryHistory) *
      eff.injury,
    0.01,
    0.85,
  );
  if (!rng.chance(p)) return null;

  // Severity skews worse for fragile bodies and older legs.
  const bad = clamp(0.10 + (58 - dur) / 220 + Math.max(0, state.age - 30) * 0.012, 0.04, 0.42);
  const r = rng.random();
  let severity;
  if (r < bad * 0.42 * eff.permanent) severity = 'severe';
  else if (r < bad + 0.24) severity = 'major';
  else severity = 'minor';

  const games =
    severity === 'severe'
      ? 52 + rng.int(30)
      : severity === 'major'
        ? 22 + rng.int(30)
        : 4 + rng.int(18);

  return { severity, games, kind: rng.pick(INJURY_KINDS[severity]) };
}

// ---------------------------------------------------------------------------
// Production
// ---------------------------------------------------------------------------
function boxScore(b, rating, minutes, eff, fit) {
  const s = b.skills;
  const iq = b.mentals.bballIQ;
  const scoring = (s.three + s.midrange + s.finishing + s.dunk) / 4;

  // Centred so a league-average rotation player lands near 20: five men on the
  // floor have to split 100% of the possessions. The rating term matters as much
  // as the skill term — offenses feed the best player on the floor, and without
  // it an 81 and an 86 post identical lines once both cap out at 38 minutes.
  const usage = clamp(
    19.5 + (rating - 67) * 0.42 + (b.mentality - 50) * 0.13 + (scoring - 66) * 0.14 + fit * 8,
    8,
    36,
  );

  let ts =
    0.50 +
    (s.three + s.midrange + s.finishing - 160) * 0.00055 +
    (iq - 50) * 0.0006 +
    fit * 0.03 -
    Math.max(0, usage - 24) * 0.004;
  ts += (eff.efficiency - 1) * 0.05;
  ts = clamp(ts, 0.40, 0.68);

  const poss = minutes * 2.05;
  const ppg = poss * (usage / 100) * ts * 2;

  const rpg = minutes * (s.rebounding * 0.0032 + Math.max(0, b.height - 78) * 0.006 + 0.015);
  const apg = minutes * (s.playmaking * 0.0034 + Math.max(0, 50 - b.mentality) * 0.0004) * eff.assists;
  const spg = minutes * (s.perimeterD * 0.0012 + 0.002);
  const bpg = minutes * (s.block * 0.0016);
  const topg = minutes * (0.055 - s.handles * 0.00022) * eff.turnovers;

  return {
    usage: round1(usage),
    ts: Math.round(ts * 1000) / 1000,
    ppg: Math.max(0, ppg),
    rpg: Math.max(0, rpg),
    apg: Math.max(0, apg),
    spg: Math.max(0, spg),
    bpg: Math.max(0, bpg),
    topg: Math.max(0.2, topg),
  };
}

// ---------------------------------------------------------------------------
// The sim
// ---------------------------------------------------------------------------
function simulateCareer(b, rng = defaultRng) {
  const potential = potentialFor(b);
  const draftOvr = draftOverallFor(b);
  const overall = potential; // headline number for the build = its ceiling
  const fit = fitFor(b);
  const traits = traitsFor(b);
  const eff = traitEffects(traits);
  const title = titleFor(b);
  const pos = positionFor(b.height);
  const draft = runDraft(b, draftOvr, potential, rng);

  const result = {
    overall,
    potential,
    draftOvr,
    fit: Math.round(fit * 100) / 100,
    position: pos,
    title,
    traits,
    rarity: buildRarityTier(b),
    drafted: draft.drafted,
    pick: draft.pick,
    hype: Math.round(draft.hype * 10) / 10,
    guaranteedByArchetype: draft.guaranteed,
    seasons: [],
    awards: { allStars: 0, mvps: 0, rings: 0, allLeague: 0 },
    seasonsLostToInjury: 0,
    teams: [],
    permanentLoss: { speed: 0, dunk: 0 },
    careerAverages: { ppg: 0, rpg: 0, apg: 0, spg: 0, bpg: 0, mpg: 0, games: 0, points: 0 },
    peakRating: 0,
    hof: false,
    bust: false,
    madeLeague: false,
  };

  if (!draft.drafted && !draft.signed) {
    result.outcome = 'never-played';
    return result;
  }
  result.madeLeague = true;

  // -------------------------------------------------------------------------
  // DEVELOPMENT
  //
  // A career is the story of closing the gap between draft-day ability and
  // potential. How much of it closes is the interesting part: work ethic, fit,
  // and — the one people forget — playing time. A prospect who never gets
  // minutes does not develop, however high his ceiling was.
  // -------------------------------------------------------------------------
  const we = b.mentals.workEthic;

  // Share of the draft-to-potential gap this player actually converts. Around
  // 0.85 typical; a grinder overshoots his projection, a coaster never arrives.
  const realization = clamp(
    (0.89 + (we - 50) * 0.0055 + fit * 0.12 + rng.gauss(0, 0.08)) * eff.growth,
    0.52,
    1.14,
  );
  const realizedPeak = clamp(draftOvr + (potential - draftOvr) * realization, 30, 99);

  const bigMan = b.height >= 82;
  const peakAge = 26 + (b.physicals.longevity - 50) * 0.06 + (bigMan ? 1 : 0) + eff.peakAge;

  // Skills the build leans on. High dependence falls off a cliff.
  const dependence =
    ((b.skills.speed + b.skills.dunk) / 2) /
    ((b.skills.three + b.skills.midrange + b.mentals.bballIQ) / 3);
  const declineRate =
    1.9 * clamp(dependence, 0.55, 2.4) * (1 - (b.physicals.longevity - 50) * 0.007) * eff.decline;

  const state = {
    age: b.draftAge,
    rating: draft.drafted ? draftOvr : draftOvr - 3,
    injuryHistory: 0,
    speedLoss: 0,
    dunkLoss: 0,
    peak: 0,
    leaps: 0,
    // Last season's minutes gate this season's development.
    lastMinutes: 14,
  };

  let team = randomTeam(rng);
  result.teams.push(team);
  const maxAge = 40 + eff.careerLength;
  const tradeChance = 0.09 * eff.tradeFreq;

  // Roster economics. REPLACEMENT is where a spot starts being contested;
  // REPLACEMENT_FLOOR is where there is no spot at any price.
  const REPLACEMENT = 66;
  const REPLACEMENT_FLOOR = 57;

  let totals = { ppg: 0, rpg: 0, apg: 0, spg: 0, bpg: 0, mpg: 0, games: 0, points: 0 };

  for (let year = 0; year < 26; year++) {
    // Athletic attrition from past severe injuries is permanent.
    const effSpeed = clamp(b.skills.speed - state.speedLoss, 25, 99);
    const effDunk = clamp(b.skills.dunk - state.dunkLoss, 25, 99);

    // Growth then decline. Gains are front-loaded — the second and third years
    // are where a prospect either arrives or stops — and gated on playing time,
    // which is why the previous season's minutes feed into this.
    let leapt = false;
    if (year > 0 && state.age < peakAge) {
      const room = realizedPeak - state.rating;
      if (room > 0) {
        const youth = clamp(1.18 - (state.age - 19) * 0.085, 0.16, 1.18);
        const playingTime = clamp(0.50 + state.lastMinutes / 24, 0.50, 1.30);
        let gain = room * 0.27 * youth * playingTime;
        // The offseason leap: a real thing, and the reason people watch young
        // players. Rare, weighted to the years where it actually happens.
        if (state.age <= 25 && rng.chance(0.11 * (0.6 + we / 90))) {
          gain += Math.abs(rng.gauss(2.6, 1.7));
          leapt = true;
          state.leaps++;
        }
        state.rating += gain + rng.gauss(0.25, 0.8);
      }
    } else {
      const past = state.age - peakAge;
      state.rating -= declineRate * (0.5 + 0.32 * past);
    }
    // Permanent athletic loss drags the rating with it.
    state.rating -= (state.speedLoss + state.dunkLoss) * 0.06;
    state.rating = clamp(state.rating, 10, 99);
    state.peak = Math.max(state.peak, state.rating);
    // Checked before the season is recorded — otherwise the log shows a year
    // played at a rating nobody would have been on a roster for.
    if (year > 0 && state.rating < REPLACEMENT_FLOOR) break;

    const rating = state.rating;
    const stamina = b.physicals.stamina;
    // On this scale: 62 is a 12-minute end-of-bench piece, 70 a starter at ~22,
    // 80 a 35-minute focal point, 85+ plays until the coach takes him out.
    let minutes = clamp((rating - 54) * 1.35 + (stamina - 50) * 0.09, 0, 38);

    const injury = injuryRoll(b, state, minutes, eff, rng);
    let games = 82;
    if (injury) {
      games = Math.max(0, 82 - injury.games);
      state.injuryHistory += injury.severity === 'severe' ? 2 : injury.severity === 'major' ? 1 : 0.4;
      if (injury.severity === 'severe') {
        const sl = Math.abs(rng.gauss(5, 2.5));
        const dl = Math.abs(rng.gauss(4.5, 2.5));
        state.speedLoss += sl;
        state.dunkLoss += dl;
        result.permanentLoss.speed = Math.round(state.speedLoss);
        result.permanentLoss.dunk = Math.round(state.dunkLoss);
      }
      if (injury.games >= 45) result.seasonsLostToInjury++;
      minutes *= clamp(0.85 + rng.random() * 0.15, 0, 1);
    }

    const modBuild = {
      ...b,
      skills: { ...b.skills, speed: effSpeed, dunk: effDunk },
    };
    const box = boxScore(modBuild, rating, minutes, eff, fit);

    // Team results.
    const wins = clamp(
      Math.round(
        41 +
          ((rating - 58) * 0.75 + (b.mentals.coachability - 50) * 0.06 + rng.gauss(0, 8)) *
            eff.teamSuccess,
      ),
      9,
      73,
    );
    const playoffs = wins >= 43 + rng.int(4);

    // Awards.
    let allStar = false;
    let mvp = false;
    let ring = false;
    // All-stars live in the 80s on this scale; 24 of 450 get picked.
    if (rating >= 76 && minutes >= 24 && games >= 50) {
      allStar = rng.chance(clamp((rating - 76) / 11, 0.03, 0.96));
    }
    if (allStar) {
      result.awards.allStars++;
      if (rating >= 84 && rng.chance(clamp((rating - 82) / 28, 0.03, 0.6))) result.awards.allLeague++;
    }
    if (allStar && rating >= 88 && wins >= 52 && games >= 62) {
      mvp = rng.chance(clamp((rating - 88) / 7, 0.05, 0.85));
      if (mvp) result.awards.mvps++;
    }
    if (playoffs) {
      // League-wide, one roster in thirty wins it: ~3% of player-seasons.
      const playoffStrength = clamp((wins - 41) / 32, 0, 1);
      const p = clamp(0.010 + playoffStrength ** 2 * 0.22, 0, 0.35) * eff.titleOdds;
      ring = rng.chance(p);
      if (ring) result.awards.rings++;
    }

    const season = {
      age: state.age,
      team,
      rating: Math.round(rating),
      games,
      minutes: round1(minutes),
      ppg: round1(box.ppg),
      rpg: round1(box.rpg),
      apg: round1(box.apg),
      spg: round1(box.spg),
      bpg: round1(box.bpg),
      topg: round1(box.topg),
      usage: box.usage,
      ts: box.ts,
      wins,
      playoffs,
      playoffPpg: playoffs ? round1(box.ppg * eff.playoffProd) : null,
      allStar,
      mvp,
      ring,
      injury,
      leapt,
    };
    result.seasons.push(season);
    state.lastMinutes = minutes;

    totals.games += games;
    totals.points += box.ppg * games;
    totals.ppg += box.ppg * games;
    totals.rpg += box.rpg * games;
    totals.apg += box.apg * games;
    totals.spg += box.spg * games;
    totals.bpg += box.bpg * games;
    totals.mpg += minutes * games;

    // Trades.
    if (rng.chance(tradeChance)) {
      let next = randomTeam(rng);
      let guard = 0;
      while (next === team && guard++ < 5) next = randomTeam(rng);
      team = next;
      if (!result.teams.includes(team)) result.teams.push(team);
    }

    state.age++;

    // Careers end two ways. A few players decline until they are finished; far
    // more are simply better than nobody and get replaced by next year's rookie.

    if (state.age > maxAge) break;

    // A single replacement level cannot do this job alone: set it low enough
    // that a slow-declining shooter can hang on to 38 and fringe rookies stop
    // churning; set it high enough to churn them and the shooter retires at 31
    // with the aging mechanic invisible. Pedigree splits the two — a team keeps
    // a declining former star far longer than a 24-year-old who was never good.
    if (state.rating < REPLACEMENT) {
      let stayP = clamp(1 - (REPLACEMENT - state.rating) / 11, 0.03, 0.93);
      const nearEnough = clamp(1 - (REPLACEMENT - state.rating) / 12, 0, 1);
      stayP += Math.min(0.34, Math.max(0, (state.peak - 66) * 0.028)) * nearEnough;
      if (!draft.drafted) stayP *= 0.6; // no guaranteed money, no rope
      if (draft.pick && draft.pick <= 14) stayP += 0.22; // teams sit on lottery picks
      if (draft.drafted && state.age <= 22) stayP += 0.18;
      if (state.age > 33) stayP *= 0.72;
      if (!rng.chance(clamp(stayP, 0.02, 0.97))) break;
    }
  }

  const g = Math.max(totals.games, 1);
  result.careerAverages = {
    ppg: round1(totals.ppg / g),
    rpg: round1(totals.rpg / g),
    apg: round1(totals.apg / g),
    spg: round1(totals.spg / g),
    bpg: round1(totals.bpg / g),
    mpg: round1(totals.mpg / g),
    games: totals.games,
    points: Math.round(totals.points),
  };

  // Hall of fame.
  const hofScore =
    result.awards.mvps * 30 +
    result.awards.allStars * 8 +
    result.awards.allLeague * 5 +
    result.awards.rings * 10 +
    result.seasons.length * 1.2 +
    (result.careerAverages.points / 1000) * 2.2;
  result.hofScore = Math.round(hofScore);
  result.hof = hofScore >= 215;

  result.peakRating = result.seasons.reduce((m, s) => Math.max(m, s.rating), 0);
  result.peakAge = Math.round(peakAge * 10) / 10;
  result.realizedPeak = Math.round(realizedPeak);
  result.leaps = state.leaps;
  result.rookieRating = result.seasons.length ? result.seasons[0].rating : null;
  result.ceiling = Math.round(realizedPeak);
  result.dependence = Math.round(dependence * 100) / 100;
  // A bust is a promise the league paid for and did not get.
  result.bust =
    draft.drafted &&
    draft.pick <= 14 &&
    result.awards.allStars === 0 &&
    (result.seasons.length < 6 || result.peakRating < 75);

  return result;
}

/* ===== src/verdict.js ===== */
// The verdict is the shareable artifact. Broadcaster, not database. Short,
// specific, a little cruel.




function pickSlot(c) {
  if (!c.drafted) return 'undrafted';
  if (c.pick === 1) return 'first overall';
  if (c.pick <= 5) return `top-five pick`;
  if (c.pick <= 14) return 'lottery pick';
  if (c.pick <= 30) return 'first-rounder';
  return 'second-rounder';
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// --- opening: how they arrived ---------------------------------------------
function opening(c, b, rng) {
  const h = formatHeight(b.height);
  const slot = pickSlot(c);
  if (!c.madeLeague) {
    return rng.pick([
      `Nobody called. A ${h} frame and a workout list that ran out of gyms.`,
      `The phone stayed quiet through both rounds and every camp after it.`,
      `Never got a number in this league. Not every build does.`,
    ]);
  }
  if (!c.drafted) {
    return rng.pick([
      `Went undrafted, signed for the minimum, and made somebody look stupid for a while.`,
      `Undrafted. Trained in an empty gym in August and talked his way onto a roster.`,
      `Sixty names came off the board. His was not one of them.`,
    ]);
  }
  if (c.guaranteedByArchetype) {
    return `Went ${ordinal(c.pick)} — the tape was never really in question.`;
  }
  if (c.hype > c.overall + 7) {
    return `Went ${ordinal(c.pick)}, which the room loved and the numbers never did.`;
  }
  if (c.hype < c.overall - 7) {
    return rng.pick([
      `Slid to ${ordinal(c.pick)}. Twenty-nine front offices are still explaining that one.`,
      `Fell to ${ordinal(c.pick)} as a ${slot}, which turned out to be the steal of the night.`,
    ]);
  }
  return `Went ${ordinal(c.pick)}.`;
}

// --- middle: what the career actually was -----------------------------------
function middle(c, b, rng) {
  const a = c.careerAverages;
  const yrs = c.seasons.length;
  if (!c.madeLeague) return '';

  const line = `${a.ppg}/${a.rpg}/${a.apg} across ${yrs} ${yrs === 1 ? 'season' : 'seasons'}`;

  if (c.awards.mvps > 0) {
    return `${line}, ${c.awards.allStars} all-star nods and ${c.awards.mvps} ${c.awards.mvps === 1 ? 'MVP' : 'MVPs'} on the mantel.`;
  }
  if (c.awards.allStars >= 5) {
    return `${line}. Five-plus trips to the all-star weekend and a peak of ${c.peakRating}.`;
  }
  if (c.awards.allStars > 0) {
    return `${line}, with ${c.awards.allStars} all-star ${c.awards.allStars === 1 ? 'appearance' : 'appearances'}.`;
  }
  if (yrs <= 2) {
    return `${line}. Gone before anyone learned the jersey number.`;
  }
  return `${line}.`;
}

// --- closing: the cruel part ------------------------------------------------
function closing(c, b, rng) {
  const title = c.title.title;
  const traitIds = new Set(c.traits.map((t) => t.id));
  const m = b.mentals;

  if (!c.madeLeague) {
    if (m.workEthic <= 25) return `The talent was arguable. The work ethic — ${m.workEthic} — was not.`;
    if (c.overall >= 60) return `Good enough to belong somewhere. This was not somewhere.`;
    return `Every league needs somebody to be better than.`;
  }

  if (c.hof) {
    return rng.pick([
      `They will retire the number and get the speech wrong anyway.`,
      `First ballot. Nobody had to argue about it.`,
      `The kind of career the next one gets measured against.`,
    ]);
  }
  if (c.bust) {
    if (traitIds.has('coasted')) return `Work ethic came back ${m.workEthic}. That is the whole autopsy.`;
    if (traitIds.has('glass')) return `The body filed for divorce in year three.`;
    return `A lottery pick is a promise. This one went unpaid.`;
  }
  if (title === 'The Chucker') {
    return `Mentality ${b.mentality} with nothing behind it. Took every shot and made the case against himself.`;
  }
  if (title === 'The Ghost') {
    return `Mentality ${b.mentality}. Had the whole bag and kept it zipped.`;
  }
  if (c.fit <= -0.25) {
    return `The build and the mentality never agreed on what he was. Neither did the coaches.`;
  }
  if (traitIds.has('shrinks') && c.awards.allStars > 0) {
    return `Eighty-two games of proof, then four in May that undid all of it.`;
  }
  if (traitIds.has('coldBlooded')) {
    return `Whatever the regular season said, the tape from the spring said more.`;
  }
  if (c.seasonsLostToInjury >= 2) {
    return `Lost ${c.seasonsLostToInjury} seasons to the training room. The good version of this was worth watching.`;
  }
  if (traitIds.has('ageless')) {
    return `Still going at ${c.seasons[c.seasons.length - 1].age}, which nobody planned for.`;
  }
  if (c.dependence >= 1.5) {
    return `Lived on the legs. The legs sent notice at ${Math.round(c.peakAge) + 3}.`;
  }
  if (c.awards.rings > 0) {
    return `Has ${c.awards.rings === 1 ? 'a ring' : `${c.awards.rings} rings`}, and that ends most arguments.`;
  }
  if (c.seasons.length >= 12) {
    return `Twelve-plus years of showing up. That is its own kind of rare.`;
  }
  return rng.pick([
    `Useful. Replaceable. Both of those are true at once.`,
    `A career. Not a story.`,
    `Somebody's favorite player. Nobody's franchise.`,
  ]);
}

function titleLine(c) {
  const t = c.traits.map((x) => x.name);
  return t.length ? `${c.title.title} — ${t.join(', ')}` : c.title.title;
}

function writeVerdict(c, b, rng = defaultRng) {
  const parts = [opening(c, b, rng), middle(c, b, rng), closing(c, b, rng)].filter(Boolean);
  return { headline: titleLine(c), body: parts.join(' ') };
}

/* ===== src/progress.js ===== */
// Everything that persists between sessions: the vault of finished careers,
// achievements, and the daily-seed streak.
//
// localStorage only — there is no backend and no account. That means progress
// is per-browser and per-device, which is worth being honest about in the UI
// rather than letting someone lose a month of pulls to a cleared cache.

const KEY = 'hooper.progress.v1';
const HISTORY_CAP = 300;

const todayStamp = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const blank = () => ({
  version: 1,
  builds: 0,
  legendaryPulls: 0,
  bestGrade: 0,
  streak: { last: null, count: 0, best: 0 },
  achievements: {},
  history: [],
});

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw || raw.version !== 1) return blank();
    return { ...blank(), ...raw, streak: { ...blank().streak, ...raw.streak } };
  } catch {
    return blank();
  }
}

function save(p) {
  try {
    localStorage.setItem(KEY, JSON.stringify(p));
  } catch {
    /* private mode or full quota — progress is a nicety, not the game */
  }
}

// ---------------------------------------------------------------------------
// Daily streak
// ---------------------------------------------------------------------------
const dayBefore = (stamp) => {
  const d = new Date(`${stamp}T12:00:00`);
  d.setDate(d.getDate() - 1);
  return todayStamp(d);
};

// Called when a daily-seed career is completed. Same day twice does not
// double-count; a gap of two or more days resets to one.
function bumpStreak(p, stamp = todayStamp()) {
  const s = p.streak;
  if (s.last === stamp) return p;
  s.count = s.last === dayBefore(stamp) ? s.count + 1 : 1;
  s.last = stamp;
  s.best = Math.max(s.best, s.count);
  return p;
}

// A streak is only alive if it was fed today or yesterday.
function streakAlive(p, stamp = todayStamp()) {
  return p.streak.last === stamp || p.streak.last === dayBefore(stamp);
}

// ---------------------------------------------------------------------------
// Achievements
//
// Each takes the finished context and returns true the moment it is earned.
// Deliberately weighted toward things the roll teaches: chasing a stat against
// height, surviving the draft, and the failure diagnoses you cannot roll.
// ---------------------------------------------------------------------------
const ACHIEVEMENTS = [
  { id: 'first', name: 'First Whistle', hint: 'Finish a build', test: () => true },
  { id: 'drafted', name: 'Hear Your Name', hint: 'Get drafted', test: (c) => c.drafted },
  { id: 'lottery', name: 'Lottery Pick', hint: 'Go in the top 14', test: (c) => c.pick && c.pick <= 14 },
  { id: 'first-overall', name: 'First Overall', hint: 'Go number one', test: (c) => c.pick === 1 },
  { id: 'freak', name: 'Freak Gene', hint: 'Roll the 1-in-300 gene', test: (c, b) => !!b.freakGene },
  {
    id: 'chase',
    name: 'Defied His Height',
    hint: 'Roll 95+ in a stat your height says you cannot have',
    test: (c, b) =>
      Object.entries(b.skills).some(([k, v]) => v >= 95 && b.skillMeta[k].expectedNatural <= 55),
  },
  { id: 'legendary-arch', name: 'Handed Something', hint: 'Pull a Legendary archetype', test: (c, b) => b.archetype?.tier === 'Legendary' },
  { id: 'mythic', name: 'Mythic Build', hint: 'Roll a Mythic-tier build', test: (c) => c.rarity.name === 'Mythic' },
  { id: 'ninety', name: 'The Ninety Club', hint: 'Roll a build with a 90+ true ceiling', test: (c) => c.potential >= 90 },
  { id: 'franchise', name: 'Franchise Player', hint: 'Peak at 90 overall', test: (c) => c.peakRating >= 90 },
  { id: 'allstar', name: 'All-Star', hint: 'Make an all-star team', test: (c) => c.awards.allStars > 0 },
  { id: 'mvp', name: 'Most Valuable', hint: 'Win an MVP', test: (c) => c.awards.mvps > 0 },
  { id: 'ring', name: 'Ring', hint: 'Win a championship', test: (c) => c.awards.rings > 0 },
  { id: 'dynasty', name: 'Dynasty', hint: 'Win three championships', test: (c) => c.awards.rings >= 3 },
  { id: 'hof', name: 'Enshrined', hint: 'Make the Hall of Fame', test: (c) => c.hof },
  { id: 'ironman', name: 'Iron Man', hint: 'Play 15 seasons', test: (c) => c.seasons.length >= 15 },
  { id: 'maxed', name: 'Reached It', hint: 'Hit your true ceiling exactly', test: (c) => c.peakRating >= c.potential },
  { id: 'chucker', name: 'Diagnosed', hint: 'Become The Chucker or The Ghost', test: (c) => !!c.title.failure },
  { id: 'undrafted-hof', name: 'Told You So', hint: 'Go undrafted and still make the Hall', test: (c) => !c.drafted && c.hof },
  { id: 'streak7', name: 'Every Day', hint: 'Play the daily seed 7 days running', test: (c, b, p) => p.streak.count >= 7 },
];

// Returns the achievements newly unlocked by this career.
function checkAchievements(p, career, build) {
  const won = [];
  for (const a of ACHIEVEMENTS) {
    if (p.achievements[a.id]) continue;
    let ok = false;
    try {
      ok = a.test(career, build, p);
    } catch {
      ok = false;
    }
    if (ok) {
      p.achievements[a.id] = Date.now();
      won.push(a);
    }
  }
  return won;
}

// ---------------------------------------------------------------------------
// The vault
// ---------------------------------------------------------------------------

// One number to rank careers by, so the vault can be sorted and a personal best
// means something. Weighted toward the things that are hard rather than long.
function careerScore(c) {
  if (!c.madeLeague) return 0;
  return Math.round(
    c.awards.mvps * 55 +
      c.awards.rings * 28 +
      c.awards.allStars * 12 +
      c.awards.allLeague * 7 +
      (c.hof ? 60 : 0) +
      c.peakRating * 1.6 +
      c.seasons.length * 2 +
      c.careerAverages.points / 900,
  );
}

function record(p, career, build, meta) {
  p.builds++;
  if (build.archetype?.tier === 'Legendary') p.legendaryPulls++;
  p.bestGrade = Math.max(p.bestGrade, meta.grade);
  p.history.unshift({
    at: Date.now(),
    daily: !!meta.daily,
    name: meta.name,
    pos: meta.pos,
    height: meta.height,
    title: meta.title,
    tier: career.rarity.name,
    draftOvr: career.draftOvr,
    grade: meta.grade,
    ceiling: career.potential,
    peak: career.peakRating,
    pick: career.pick,
    seasons: career.seasons.length,
    allStars: career.awards.allStars,
    mvps: career.awards.mvps,
    rings: career.awards.rings,
    hof: career.hof,
    score: careerScore(career),
  });
  if (p.history.length > HISTORY_CAP) p.history.length = HISTORY_CAP;
  return p;
}

function bestCareers(p, n = 25) {
  return [...p.history].sort((a, b) => b.score - a.score).slice(0, n);
}

// ---------------------------------------------------------------------------
// Backup and restore
//
// iOS can clear a site's stored data. Home-screen apps are exempt from the
// aggressive seven-day rule, but "exempt in normal conditions" is not a promise
// worth staking a month of pulls on, and there is no server to fall back to.
// Making progress exportable turns an unrecoverable loss into an inconvenience.
// ---------------------------------------------------------------------------
// The `app` tag and the localStorage key both stay at their original values.
// The game was renamed; a backup someone exported before the rename was not,
// and breaking those to match a title would lose real progress for nothing.
function exportProgress(p) {
  return JSON.stringify({ app: 'build-a-hooper', exported: new Date().toISOString(), data: p });
}

// Returns { ok, progress, error }. Never throws and never partially applies —
// a bad paste has to leave existing progress untouched.
function importProgress(text) {
  let parsed;
  try {
    parsed = JSON.parse(String(text).trim());
  } catch {
    return { ok: false, error: 'That is not valid backup text.' };
  }
