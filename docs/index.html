  const d = parsed && parsed.app === 'build-a-hooper' ? parsed.data : parsed;
  if (!d || typeof d !== 'object' || typeof d.builds !== 'number' || !Array.isArray(d.history)) {
    return { ok: false, error: 'That does not look like a Hoop Life backup.' };
  }
  const merged = { ...blank(), ...d, streak: { ...blank().streak, ...(d.streak || {}) } };
  merged.version = 1;
  if (merged.history.length > HISTORY_CAP) merged.history.length = HISTORY_CAP;
  return { ok: true, progress: merged };
}

// ---------------------------------------------------------------------------
// The life in progress
//
// Kept separate from the vault: the vault is a record of finished careers, this
// is one live object that gets overwritten constantly. Without it a phone
// dropping the tab from memory costs you eight years of decisions, which on a
// game built entirely out of decisions is the whole thing.
//
// Stored as-is. Everything in a life is plain data by construction — the engine
// takes the life and the rng as arguments rather than closing over either — so
// a round trip through JSON returns something the engine still accepts.
// ---------------------------------------------------------------------------
const LIFE_KEY = 'hooper.life.v1';

// Bumped whenever the shape of a life changes. A stored life from an older
// build can satisfy every field check the loader makes and still be missing
// something the engine now requires — the slot-based lives had no `people` and
// no `stats` — so the version is checked first and a mismatch is discarded
// rather than half-restored into a crash on the next render.
//
// The field checks below must track the current shape too. They kept testing
// `life.time` after the time budget was removed, which silently discarded every
// save on every load: the game looked fine and just never resumed anything.
const LIFE_SHAPE = 3;

function saveLife(life) {
  try {
    if (!life) localStorage.removeItem(LIFE_KEY);
    else localStorage.setItem(LIFE_KEY, JSON.stringify({ shape: LIFE_SHAPE, life }));
  } catch {
    /* private mode or full quota — the life is still playable in memory */
  }
}

function loadLife() {
  try {
    const raw = JSON.parse(localStorage.getItem(LIFE_KEY));
    if (!raw || raw.shape !== LIFE_SHAPE) return null;
    const life = raw.life;
    if (!life || typeof life.age !== 'number' || !life.build?.skills || !life.attrs) return null;
    if (!Array.isArray(life.people) || !life.stats || !life.trainCounts) return null;
    return life;
  } catch {
    return null;
  }
}

// Bundled together under one exported name. The bundler flattens modules into a
// single scope, so `import * as P` has no namespace object to bind to and any
// `P.foo` becomes a ReferenceError in the built file while the dev server keeps
// working. Importing this object by its real name survives flattening.
const Progress = {
  todayStamp, load, save, bumpStreak, streakAlive,
  ACHIEVEMENTS, checkAchievements, careerScore, record, bestCareers,
  exportProgress, importProgress, saveLife, loadLife,
};

/* ===== src/life.js ===== */
// HOOP LIFE — the year-by-year engine.
//
// The roll engine still does what it always did, but it now describes GENETICS:
// the height you will finish at and the ceiling on every attribute. At fourteen
// you are nowhere near either. What you do with the next four to eight years
// decides how close you get, and whether anyone offers you anything at the end.
//
// The path is high school (14-18), then college (18-22) with the option to
// declare early, then the pro engine.
//
// A year is a budget of TIME, not a list of slots. You spend it across four
// categories — the gym, school, the people around you, and everything else —
// and most of what you can spend it on is CONDITIONAL, so the menu is different
// for a benchwarmer with failing grades than for a five-star with an agent.
// Nothing here is separable: school raises smarts, smarts is what makes film
// study worth anything, film study raises basketball IQ, IQ raises your rating.
// Teammates who like you feed you the ball. A coach who does not trust you does
// not play you, and minutes are what recruiters see.








const START_AGE = 14;
const GRAD_AGE = 18;
const DRAFT_AGE_CAP = 22;

// The same age is a different year depending on which building you are in: an
// eighteen-year-old is either a graduating senior or a college freshman, so the
// grade has to be read off the stage and not the age alone.
const HS_GRADE = { 14: 'Freshman', 15: 'Sophomore', 16: 'Junior', 17: 'Senior' };
const COLLEGE_GRADE = { 18: 'Freshman', 19: 'Sophomore', 20: 'Junior', 21: 'Senior' };
const gradeName = (age, stage = 'highschool') =>
  (stage === 'college' ? COLLEGE_GRADE : HS_GRADE)[age] || 'Senior';

// ---------------------------------------------------------------------------
// Growing up
//
// The rolled height is the ADULT height. A fourteen-year-old is some way short
// of it, and the last of that gap can arrive all at once — which is the whole
// point of a growth spurt, because every expected value in the game is keyed to
// height. Grow four inches and what the game expects of you changes underneath.
// ---------------------------------------------------------------------------
function heightAt(life, age = life.age) {
  if (age >= 18) return life.adultHeight;
  const remaining = life.adultHeight - life.startHeight;
  const done = { 14: 0, 15: 0.34, 16: 0.63, 17: 0.86, 18: 1 }[Math.min(age, 18)] ?? 1;
  return Math.round(life.startHeight + remaining * done + (life.spurtBonus[age] || 0));
}

// Where you started. Exposure costs money — AAU and camps are what put you in
// front of anyone — so who your family is quietly gates the whole recruiting
// path. It can be beaten with a job and some time, which is the point: it is a
// disadvantage, not a wall.
const BACKGROUNDS = [
  { id: 'struggling', name: 'Struggling', chance: 0.30, start: 250, yearly: 500,
    note: 'No money for camps. Everything has to be earned.' },
  { id: 'working', name: 'Working class', chance: 0.42, start: 900, yearly: 1500,
    note: 'They will find the money if it matters.' },
  { id: 'comfortable', name: 'Comfortable', chance: 0.22, start: 2400, yearly: 3200,
    note: 'Camps and trainers are not a problem.' },
  { id: 'wealthy', name: 'Wealthy', chance: 0.06, start: 6000, yearly: 7000,
    note: 'Money is never the reason you miss anything.' },
];

function rollBackground(rng) {
  const r = rng.random();
  let acc = 0;
  for (const b of BACKGROUNDS) { acc += b.chance; if (r < acc) return b; }
  return BACKGROUNDS[1];
}

// ---------------------------------------------------------------------------
// A new life
// ---------------------------------------------------------------------------
function newLife(build, name, rng = defaultRng) {
  const background = rollBackground(rng);
  const adultHeight = build.height;
  const startHeight = adultHeight - clamp(Math.round(rng.gauss(7.5, 2.2)), 3, 12);

  const spurtBonus = {};
  if (rng.chance(0.55)) spurtBonus[15 + rng.int(3)] = 1 + rng.int(3);

  const attrs = {};
  for (const k of SKILL_KEYS) {
    attrs[k] = clamp(Math.round(build.skills[k] * (0.42 + rng.random() * 0.14)), 20, 99);
  }

  const life = {
    name,
    age: START_AGE,
    stage: 'highschool',
    pending: null,
    build, // genetics: ceilings, archetype, mentality, hidden mentals
    adultHeight,
    startHeight,
    spurtBonus,
    attrs,
    physicals: { ...build.physicals },
    mentals: { ...build.mentals },

    // The four bars.
    stats: {
      happiness: 60 + rng.int(20),
      health: 84 + rng.int(14),
      smarts: clamp(Math.round(rng.gauss(50, 17)), 8, 96),
    },
    // Basketball-specific, and reputation, which is separate from hype on
    // purpose: hype is how many people know your name, reputation is what they
    // say after it. One sells shoes, the other decides whether a front office
    // spends a lottery pick.
    meters: {
      hype: 4 + rng.int(6),
      rep: 48 + rng.int(8),
      grades: 55 + rng.int(26),
    },

    background,
    money: background.start + rng.int(400),
    nextPersonId: 0,
    people: [],

    // The hidden slider. Rolled once, never shown, and it multiplies everything
    // training does — two players who make identical decisions for eight years
    // do not arrive at the same place, and this is why. Revealed with the other
    // hidden numbers only after the career is over.
    talent: clamp(Math.round(rng.gauss(50, 18)), 5, 99),

    // The year in progress.
    strain: 0,
    doneThisYear: [],
    // Sessions spent on each attribute THIS YEAR. The fourth one is worth
    // nothing, so grinding a single number is self-limiting without needing a
    // rule that says so.
    trainCounts: {},
    yearLog: [],
    seenEvents: [],
    pendingChoice: null,

    program: null,
    stock: 0, // pre-draft process: workouts, interviews, agency
    teamRole: 'JV bench',
    minutes: 0,
    lastMinutes: 0,
    lastStats: null,
    seasonStats: null,
    minutesPitch: false,
    wantsTransfer: false,
    injured: false,
    ineligible: false,
    history: [],
    log: [],
    offers: [],
  };
  life.people = rollCast(life, rng);
  return life;
}

// Current overall on the 2K-ish scale, from present ability at present height.
function overallNow(life) {
  const h = heightAt(life);
  let sum = 0;
  let n = 0;
  for (const k of SKILL_KEYS) {
    const w = Math.abs(SKILLS[k].growth) > 1.5 ? 1.3 : 1;
    sum += life.attrs[k] * w;
    n += w;
  }
  const base = sum / n;
  return clamp(Math.round(base * 1.15 + (h - 72) * 0.7 + life.mentals.bballIQ * 0.05), 10, 99);
}

// What the ranking services are reacting to: production, at a level they can
// see. Hype alone let anyone who bought enough camps into the top hundred;
// ability alone ignored that nobody has heard of you.
function recruitScore(life) {
  return overallNow(life) * 0.58 + life.meters.hype * 0.42;
}

// Star rating is a RANK, not a score — five-stars are the couple-dozen best
// players in a country, so the cuts are measured percentiles of the recruit
// population, not round numbers.
function starRating(life) {
  const s = recruitScore(life);
  for (let i = STAR_CUTS.length - 1; i >= 0; i--) if (s >= STAR_CUTS[i]) return i + 2;
  return 1;
}

// ---------------------------------------------------------------------------
// Events. Written to fire off state rather than at random, so they read as
// consequences of how the year was actually spent.
// ---------------------------------------------------------------------------
function rollEvents(life, rng, out) {
  const m = life.meters;
  const st = life.stats;
  const college = life.stage === 'college';

  if (life.spurtBonus[life.age]) {
    out.push({ kind: 'good', text: `Growth spurt — ${life.spurtBonus[life.age]}" over the summer. Nothing fits.` });
  }
  if (life.strain > 70 && rng.chance(0.5)) {
    out.push({ kind: 'bad', text: 'Ran yourself into the ground. Everything hurts and none of it is helping.' });
    st.health = clamp(st.health - 12, 0, 100);
  }
  if (st.happiness < 25 && rng.chance(0.45)) {
    out.push({ kind: 'bad', text: 'Stopped enjoying any of it. Turning up became the hard part.' });
    life.mentals.workEthic = clamp(life.mentals.workEthic - 3, 1, 99);
  }
  if (m.grades < 40) {
    out.push({
      kind: 'bad',
      text: `Grades at ${Math.round(m.grades)}. The ${college ? 'compliance office' : 'athletic director'} has started using the word "ineligible".`,
    });
    if (m.grades < 28) {
      life.ineligible = true;
      out.push({ kind: 'bad', text: 'Academically ineligible. You sit the season out.' });
    }
  }

  // Injury risk rises with accumulated strain and falls with health.
  const injRisk = clamp(0.05 + life.strain / 380 + (72 - st.health) / 340, 0.02, 0.45);
  if (rng.chance(injRisk)) {
    if (rng.chance(0.22)) {
      out.push({ kind: 'bad', text: 'Tore something in the knee. Surgery, then a year of rebuilding.' });
      st.health = clamp(st.health - 30, 0, 100);
      life.injured = true;
      life.attrs.speed = clamp(life.attrs.speed - 4, 20, 99);
      life.attrs.dunk = clamp(life.attrs.dunk - 4, 20, 99);
      life.stock = clamp(life.stock - 8, -40, 40);
    } else {
      out.push({ kind: 'bad', text: 'Rolled an ankle. Missed a chunk of the season.' });
      st.health = clamp(st.health - 10, 0, 100);
    }
  }

  const chem = teamChemistry(life);
  if (chem < 30 && rng.chance(0.45)) {
    out.push({ kind: 'bad', text: 'The locker room has decided about you. Nobody is looking for you on the break.' });
  } else if (chem > 74 && rng.chance(0.3)) {
    out.push({ kind: 'good', text: 'This group actually likes each other. It shows.' });
  }
  if (coachTrust(life) < 25 && rng.chance(0.4)) {
    out.push({ kind: 'bad', text: 'You and the coach are not speaking. That is not a fight you win.' });
  }

  if (!college && m.hype > 70 && rng.chance(0.25)) {
    out.push({ kind: 'good', text: 'Letters are arriving from schools you have only seen on television.' });
  }
  if (college) {
    if (m.hype > 55 && m.rep < 42 && rng.chance(0.26)) {
      out.push({ kind: 'bad', text: 'A sideline blow-up runs on every highlight show. Scouts start asking about your character.' });
      m.rep = clamp(m.rep - 8, 0, 100);
      life.stock = clamp(life.stock - 6, -40, 40);
    }
    if (m.rep > 72 && rng.chance(0.3)) {
      out.push({ kind: 'good', text: 'You handle a bad loss well on camera. Two front offices note it.' });
      life.stock = clamp(life.stock + 4, -40, 40);
    }
  }
}

// ---------------------------------------------------------------------------
// Play one year
//
// Everything the player chose has already been applied through doAction; this
// runs the consequences: drift, the body, the season, and the events.
// ---------------------------------------------------------------------------
function advanceYear(life, rng = defaultRng) {
  const stageAtStart = life.stage;
  const playedGrade = gradeName(life.age, stageAtStart);
  const college = stageAtStart === 'college';
  const m = life.meters;
  const st = life.stats;
  const prog = life.program;
  const out = [...life.yearLog];

  // 1. Everyone drifts a little without being told to — you improve just by
  //    being fifteen and playing, and less so every year after that.
  const drift = clamp(0.052 - (life.age - 14) * 0.003, 0.02, 0.052) * (college ? prog.development : 1);
  for (const k of SKILL_KEYS) {
    const room = life.build.skills[k] - life.attrs[k];
    if (room > 0) life.attrs[k] = clamp(life.attrs[k] + room * drift, 20, 99);
  }
  // School pays back into basketball. A year of classes makes the film sessions
  // worth more, and the mind is the part of the game that never declines.
  life.mentals.bballIQ = clamp(
    Math.round(life.mentals.bballIQ + (st.smarts - 45) * 0.03 + 0.4),
    1, 99,
  );

  // 2. The body and the books both decay if left alone.
  life.money += college ? Math.round(life.background.yearly * 0.4) : life.background.yearly;
  m.grades = clamp(m.grades - (college ? 10 : 8), 0, 100);
  life.strain = Math.max(0, life.strain - 26);
  st.health = clamp(st.health + 5 - life.strain / 22, 0, 100);
  st.happiness = clamp(st.happiness - 4, 0, 100);

  // 3. Grow.
  const before = heightAt(life);
  life.age++;
  const after = heightAt(life);
  if (after > before && !life.spurtBonus[life.age]) {
    out.push({ kind: 'note', text: `Grew ${after - before}" — now ${Math.floor(after / 12)}'${after % 12}".` });
  }

  // 4. The season.
  const ovr = overallNow(life);
  // Judged against the room you are actually in. A freshman is supposed to be
  // worse than a senior, and a blue blood's bench is a mid-major's starter, so
  // the bar moves with both.
  const bar = college ? prog.minutesBar - (life.age - 19) * 2 : 25 + (life.age - 15) * 3;
  const chem = teamChemistry(life);
  const trust = coachTrust(life);
  // The coach decides minutes and the locker room decides what you do with
  // them. Both are people you chose whether or not to spend time on.
  const roleScore =
    ovr +
    (trust - 50) * 0.18 +
    (chem - 50) * 0.08 +
    (life.minutesPitch ? 3 : 0) -
    (life.ineligible ? 100 : 0) -
    (life.injured ? 14 : 0);
  life.minutes = clamp(Math.round((roleScore - bar) * 1.2), 0, college ? 34 : 32);

  if (life.ineligible) {
    life.seasonStats = null;
    life.teamRole = 'Ineligible';
    out.push({ kind: 'bad', text: 'You did not play a minute this year.' });
    life.ineligible = false;
  } else if (life.minutes < 4) {
    life.seasonStats = null;
    life.teamRole = college ? 'Redshirted — buried on the bench' : 'Cut from the team';
    out.push({
      kind: 'bad',
      text: college ? 'You never got off the bench. A wasted year.' : 'Cut. You are not on the roster this year.',
    });
    m.hype = clamp(m.hype - 8, 0, 100);
  } else {
    const [star, starter, rot] = college ? [30, 22, 12] : [28, 21, 12];
    life.teamRole =
      life.minutes >= star ? 'Star' : life.minutes >= starter ? 'Starter'
      : life.minutes >= rot ? 'Rotation' : 'Deep bench';
    const scoring = (life.attrs.three + life.attrs.midrange + life.attrs.finishing + life.attrs.dunk) / 4;
    const ppg = Math.max(0, life.minutes * 0.42 * (0.5 + scoring / 110) + rng.gauss(0, 1.6));
    const rpg = Math.max(0, life.minutes * (life.attrs.rebounding / 900 + Math.max(0, after - 72) * 0.008));
    // A team that likes you passes to you. This is the assist line, and it is
    // the clearest place the locker room shows up in a box score.
    const apg = Math.max(0, life.minutes * (life.attrs.playmaking / 1100) * (0.6 + chem / 125));
    life.seasonStats = {
      ppg: Math.round(ppg * 10) / 10,
      rpg: Math.round(rpg * 10) / 10,
      apg: Math.round(apg * 10) / 10,
      mpg: life.minutes,
    };
    const produced = ppg * 1.5 + rpg * 0.8 + apg * 1.1;
    const exposure = college ? prog.exposure : 1;
    // Diminishing returns: the gap between the best player in the country and
    // the fiftieth is not something one good season closes.
    m.hype = clamp(m.hype + produced * 0.30 * exposure * (1 - m.hype / 112) - 3, 0, 100);
    st.happiness = clamp(st.happiness + (life.minutes > 20 ? 6 : 0), 0, 100);
    if (college) life.stock = clamp(life.stock + (produced - 26) * 0.22, -40, 40);
  }

  // 5. Events. The situational ones above are conditions of the simulation —
  //    ineligibility, injury, the locker room — and fire every year they apply.
  //    The table in events.js is the rest of a life happening to you.
  rollEvents(life, rng, out);
  const rolled = rollYearEvents(life, rng);
  out.push(...rolled.passive);
  life.choice = rolled.choice;
  driftRelationships(life, rng);

  const entry = {
    age: life.age,
    stage: stageAtStart,
    grade: playedGrade,
    school: college ? prog.school : null,
    height: after,
    ovr: overallNow(life),
    stars: starRating(life),
    role: life.teamRole,
    stats: life.seasonStats,
    events: out,
  };
  life.log.push(entry);
  life.history.push({ age: life.age, ovr: entry.ovr, hype: Math.round(m.hype) });

  // 6. Reset the year and decide what comes next.
  life.lastMinutes = life.minutes;
  life.lastStats = life.seasonStats;
  life.doneThisYear = [];
  life.trainCounts = {};
  life.yearLog = [];
  life.minutesPitch = false;

  if (stageAtStart === 'highschool' && life.age >= GRAD_AGE) {
    life.offers = buildOffers(life, rng);
    life.pending = 'decision';
  } else if (college) {
    if (life.wantsTransfer && life.age < DRAFT_AGE_CAP) {
      life.wantsTransfer = false;
      life.offers = buildOffers(life, rng, { transfer: true });
      life.pending = 'transfer';
    } else {
      // Every college year after the first ends with the same question, and at
      // twenty-two it is answered for you.
      life.pending = life.age >= DRAFT_AGE_CAP ? 'forced' : 'declare';
    }
  }
  return entry;
}

// ---------------------------------------------------------------------------
// Recruiting
//
// Offers key off exposure AND production AND grades. A five-star with failing
// grades gets prep-school offers; a two-star who can actually play gets small
// schools willing to take a chance.
//
// The `min` values are measured percentiles of the recruit-score distribution,
// not round numbers — before they were measured, eighteen percent of every
// class was getting a blue-blood offer.
// ---------------------------------------------------------------------------
const PROGRAMS = [
  { tier: 'Blue blood', names: ['Kingsmere', 'Ashford State', 'Vance University'],
    min: RECRUIT_CUTS.blueBlood, dev: 1.30, minutesBar: 54, exposure: 1.6,
    note: 'You would be the fourth-best player in your own recruiting class.' },
  { tier: 'High major', names: ['Northgate A&M', 'Loomis Tech', 'St. Brannon'],
    min: RECRUIT_CUTS.highMajor, dev: 1.18, minutesBar: 49, exposure: 1.25,
    note: 'You will have to earn it, but the staff develops people.' },
  { tier: 'Mid major', names: ['Cedar Falls', 'Harlow College', 'Pinehurst'],
    min: RECRUIT_CUTS.midMajor, dev: 1.05, minutesBar: 44, exposure: 0.85,
    note: 'A real role as a freshman, and the ball in your hands.' },
  { tier: 'Small school', names: ['Delta Poly', 'Ironwood College', 'Junction State'],
    min: RECRUIT_CUTS.smallSchool, dev: 0.92, minutesBar: 38, exposure: 0.5,
    note: 'They promise the ball from day one. Nobody is watching.' },
];

function buildOffers(life, rng = defaultRng, { transfer = false } = {}) {
  const m = life.meters;
  const score = recruitScore(life) + (m.grades - 50) * 0.12;
  const offers = [];

  for (const p of PROGRAMS) {
    if (score < p.min) continue;
    if (m.grades < 35 && p.tier !== 'Small school') continue; // schools have standards
    if (transfer && life.program && p.tier === life.program.tier && rng.chance(0.5)) continue;
    offers.push({
      tier: p.tier,
      school: rng.pick(p.names),
      development: p.dev,
      minutesBar: p.minutesBar,
      exposure: p.exposure,
      note: p.note,
    });
  }

  // There is always somewhere to go, even if nobody wanted you.
  offers.push({
    tier: 'Other',
    school: transfer ? 'Drop down a level' : 'Prep year / overseas',
    development: 1.02, minutesBar: transfer ? 34 : 42, exposure: 0.45,
    note: transfer ? 'Somewhere you will definitely play.' : 'Nobody offered. You go and make them wrong.',
  });

  // The other door: skip it entirely. Almost nobody should take this and get
  // away with it, which is exactly why it is on the menu.
  if (!transfer && starRating(life) >= 4) {
    offers.push({
      tier: 'Turn pro', school: 'Declare out of high school', development: 1, minutesBar: 0, exposure: 1,
      pro: true,
      note: 'Eighteen years old and into the draft. No safety net, and four years of development you never got.',
    });
  }
  return offers;
}

function commit(life, offer, rng = defaultRng) {
  life.program = offer;
  life.stage = 'college';
  life.pending = null;
  life.teamRole = 'Freshman — unproven';
  life.minutes = 0;
  life.offers = [];
  // A new school is a new locker room. That is the cost of transferring, and
  // the reason a good one is worth staying in.
  life.people = newRoster(life, rng);
  return life;
}

// Leave school. Everything after this belongs to the pro engine.
function declare(life) {
  life.stage = 'pro';
  life.pending = null;
  return life;
}

// Stay another year. The only thing it clears is the question.
function returnToSchool(life) {
  life.pending = null;
  return life;
}

// ---------------------------------------------------------------------------
// The handoff to the pro engine
//
// The build the draft sees is neither raw genetics (which would make school
// pointless) nor present ability (which would make everyone a bust): it is
// where this path projects him to top out.
//
// The share of the remaining genetic gap that pro development closes is larger
// the younger he declares, because a nineteen-year-old has more years of it
// ahead than a twenty-two-year-old who is close to finished. That is the real
// trade: stay and bank ability, or leave early and sell the runway.
// ---------------------------------------------------------------------------
function proBuildFrom(life) {
  const declareAge = clamp(life.age, 18, 23);
  const runway = clamp((24 - declareAge) / 5, 0.2, 1);
  const share = clamp((0.30 + runway * 0.38) * (0.72 + life.mentals.workEthic / 130), 0.2, 0.88);

  const skills = Object.fromEntries(
    SKILL_KEYS.map((k) => {
      const now = life.attrs[k];
      const ceiling = life.build.skills[k];
      return [k, clamp(Math.round(now + Math.max(0, ceiling - now) * share), 25, 99)];
    }),
  );

  const b = {
    ...life.build,
    height: life.adultHeight,
    skills,
    physicals: { ...life.physicals },
    mentals: { ...life.mentals },
    draftAge: declareAge,
  };
  // What the scouts actually saw. Exposure, the pre-draft process and how you
  // came across all move the draft, not the player.
  b.rawness =
    (life.build.rawness ?? 0) -
    (life.meters.hype - 50) * 0.035 -
    (life.meters.rep - 50) * 0.03 -
    life.stock * 0.12;
  return b;
}

// A coarse, deliberately imprecise read on where he would go if he declared
// now. It is a projection and it is allowed to be wrong — the exact ceiling
// stays hidden, which is the whole point.
function draftProjection(life) {
  const b = proBuildFrom(life);
  const hype = draftOverallFor(b) * 0.35 + potentialFor(b) * 0.65 + (life.build.scoutNoise ?? 0) * 2.5;
  if (hype >= DRAFT_CUTOFF + 16) return { label: 'Projected lottery pick', tone: 'good' };
  if (hype >= DRAFT_CUTOFF + 8) return { label: 'Projected first round', tone: 'good' };
  if (hype >= DRAFT_CUTOFF) return { label: 'Projected second round', tone: 'note' };
  if (hype >= DRAFT_CUTOFF - 7) return { label: 'On the fringe — could go undrafted', tone: 'note' };
  return { label: 'Nobody has you on a board', tone: 'bad' };
}

/* ===== web/main.js ===== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const money = (n) => `$${Math.round(n).toLocaleString()}`;
const LABELS = {
  ...Object.fromEntries(Object.entries(SKILLS).map(([k, v]) => [k, v.label])),
  ...Object.fromEntries(Object.entries(PHYSICALS).map(([k, v]) => [k, v.label])),
  ...Object.fromEntries(Object.entries(MENTALS).map(([k, v]) => [k, v.label])),
};

const S = { life: null, prog: Progress.load(), career: null, verdict: null, wonBadges: null, sheet: null, sheetActions: [] };

// ---------------------------------------------------------------------------
// New life / resume
// ---------------------------------------------------------------------------
function startLife() {
  const rng = defaultRng;
  // The roll engine still runs in full — it is now describing genetics: the
  // height he finishes at and the ceiling on every attribute.
  const build = rollCompleteBuild(rng);
  S.life = newLife(build, randomName(rng), rng);
  S.career = null;
  S.verdict = null;
  S.wonBadges = null;
  Progress.saveLife(S.life);
  closeSheet();
  render(true);
}

// Pick a life back up where it was left. A career that already finished is not
// resumable — there is nothing left to decide — so that one starts fresh.
function resumeOrStart() {
  const saved = Progress.loadLife();
  if (!saved || saved.stage === 'pro') { startLife(); return; }
  S.life = saved;
  render(true);
  // A life saved mid-question re-asks it. Otherwise the answer would be lost
  // and the year would move on having quietly skipped a decision.
  if (S.life.choice) openChoice();
  else if (S.life.pending) openDecision();
}

// ---------------------------------------------------------------------------
// Header
// ---------------------------------------------------------------------------
function idcardHtml() {
  const L = S.life;
  const college = L.stage === 'college';
  const stars = starRating(L);
  const where = college ? esc(L.program.school) : esc(L.background.name);
  const line2 = college
    ? (() => { const p = draftProjection(L); return `<span class="proj ${p.tone}">${esc(p.label)}</span>`; })()
    : `<span class="stars">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</span>`;

  return `
    <div>
      <div class="nm">${esc(L.name)}</div>
      <div class="sub">${gradeName(L.age, L.stage)} &middot; ${formatHeight(heightAt(L))}
        &middot; OVR ${overallNow(L)} &middot; ${esc(L.teamRole)}</div>
      <div class="sub">${line2} &middot; ${where}</div>
    </div>
    <div class="cash"><b>${money(L.money)}</b><span>Bank balance</span></div>`;
}

const BARS = [
  ['happiness', 'Happiness', 'var(--happy)'],
  ['health', 'Health', 'var(--health)'],
  ['smarts', 'Smarts', 'var(--smarts)'],
];

function barsHtml() {
  const L = S.life;
  const rows = [
    ...BARS.map(([k, label, col]) => [Math.round(L.stats[k]), label, col]),
    [Math.round(L.meters.rep), 'Reputation', 'var(--rep)'],
  ];
  return rows
    .map(([v, label, col]) => `<div class="row ${v < 25 ? 'low' : ''} ${v >= 88 ? 'full' : ''}">
      <div class="k">${label}</div>
      <div class="track"><div class="fill" style="width:${clamp(v, 0, 100)}%;background:${col}"></div><span class="v">${v}%</span></div>
    </div>`)
    .join('');
}

// ---------------------------------------------------------------------------
// The feed — oldest at the top, this year at the bottom, the way a life reads
// ---------------------------------------------------------------------------
function yearHtml(e) {
  const stats = e.stats
    ? `<div class="box">${esc(e.role)} &middot; ${e.stats.ppg} pts, ${e.stats.rpg} reb, ${e.stats.apg} ast in ${e.stats.mpg} min</div>`
    : `<div class="box">${esc(e.role)} &mdash; no stats this year</div>`;
  return `<article class="yr">
    <h3>${esc(e.grade)} year${e.school ? ` &middot; ${esc(e.school)}` : ''}
      <span class="meta">${formatHeight(e.height)} &middot; OVR ${e.ovr}${
        e.stage === 'college' ? '' : ` &middot; ${'★'.repeat(e.stars)}`
      }</span></h3>
    ${stats}
    ${e.events.map((v) => `<div class="line ${v.kind}">${esc(v.text)}</div>`).join('')}
  </article>`;
}

function feedHtml() {
  const L = S.life;
  if (S.career) return careerHtml();
  const past = L.log.map(yearHtml).join('');
  const now = `<article class="yr now">
    <h3>${esc(gradeName(L.age, L.stage))} year <span class="meta">in progress</span></h3>
    ${
      L.yearLog.length
        ? L.yearLog.map((v) => `<div class="line ${v.kind}">${esc(v.text)}</div>`).join('')
        : '<div class="empty">Nothing yet. Tap the buttons below, then press + Age.</div>'
    }
  </article>`;
  return past + now;
}

// ---------------------------------------------------------------------------
// The sheet — one component, several contents
// ---------------------------------------------------------------------------
function openSheet(kind, arg) {
  S.sheet = { kind, arg };
  drawSheet();
  $('sheet').classList.remove('hidden');
  $('scrim').classList.remove('hidden');
}
function closeSheet() {
  S.sheet = null;
  S.sheetActions = [];
  $('sheet').classList.add('hidden');
  $('scrim').classList.add('hidden');
  // Emptied, not just hidden. A hidden sheet full of last screen's buttons is
  // still in the accessibility tree and still matches a query, so it can be
  // acted on by something that has no business finding it.
  $('sheetBody').innerHTML = '';
}

// What a session is worth, per attribute, computed live — so an option that
// would move nothing says so before you spend a year on it rather than after.
function trainTags(a) {
  if (!a.trains) return '';
  return Object.entries(a.trains)
    .map(([k, w]) => [k, previewGain(S.life, k, w)])
    .sort((x, y) => y[1] - x[1])
    .map(([k, g]) => `<span class="tag ${g < 0.4 ? 'dim' : 'gain'}">${esc(LABELS[k])} ${g < 0.05 ? '—' : `+${g.toFixed(1)}`}</span>`)
    .join('');
}

function tagsFor(a, blocked) {
  const t = [];
  if (a.price) t.push(`<span class="tag spend">${money(a.price)}</span>`);
  t.push(trainTags(a));
  const wear = strainWarning(S.life, a);
  if (wear) t.push(`<span class="tag wear">${esc(wear)}</span>`);
  if (blocked) t.push(`<span class="tag no">${esc(blocked)}</span>`);
  const joined = t.filter(Boolean).join('');
  return joined ? `<span class="tags">${joined}</span>` : '';
}

function optRow(a, idx) {
  const blocked = blockedReason(S.life, a);
  return `<button class="opt" data-act="${idx}" type="button" ${blocked ? 'disabled' : ''}>
    <span>
      <span class="t">${esc(a.name)}</span>
      ${a.blurb ? `<span class="d">${esc(a.blurb)}</span>` : ''}
      ${tagsFor(a, blocked)}
    </span>
    <span class="go">&rsaquo;</span>
  </button>`;
}

// One attribute, worked on its own. The row carries the whole picture: where it
// is, how far your genetics let it go, what this session adds, and how many
// more are worth taking this year.
function focusRow(a, idx) {
  const cap = S.life.build.skills[a.key];
  const spent = a.gain < 0.05;
  return `<button class="opt focus" data-act="${idx}" type="button" ${spent ? 'disabled' : ''}>
    <span>
      <span class="t">${esc(a.name)} <b class="num">${a.now}</b></span>
      <span class="bar"><span class="now" style="width:${clamp(a.now, 0, 100)}%"></span>
        <span class="cap" style="left:${clamp(cap, 0, 99)}%"></span></span>
      <span class="tags">
        ${
          a.maxed
            ? '<span class="tag dim">At your genetic ceiling</span>'
            : spent
              ? '<span class="tag dim">Nothing left in it this year</span>'
              : `<span class="tag gain">+${a.gain.toFixed(1)} this session</span>
                 <span class="tag ${a.left <= 1 ? 'wear' : ''}">${a.left} more worth taking</span>`
        }
      </span>
    </span>
    <span class="go">&rsaquo;</span>
  </button>`;
}

const AVATAR = {
  father: '👨', mother: '👩', sibling: '🧒', coach: '📋', teammate: '🏀',
  trainer: '🏋️', friend: '🙂', partner: '💛', agent: '📞',
};
const relColour = (v) => (v >= 66 ? 'var(--good)' : v >= 38 ? 'var(--warn)' : 'var(--bad)');

function peopleListHtml() {
  const L = S.life;
  const order = ['coach', 'teammate', 'trainer', 'agent', 'mother', 'father', 'sibling', 'partner', 'friend'];
  const sorted = [...L.people].filter((p) => p.alive)
    .sort((a, b) => order.indexOf(a.role) - order.indexOf(b.role));
  let lastGroup = null;
  return sorted.map((p) => {
    const g = ROLES[p.role]?.group || 'Other';
    const head = g === lastGroup ? '' : `<div class="grp">${esc(g)}</div>`;
    lastGroup = g;
    return `${head}<button class="who" data-person="${p.id}" type="button">
      <span class="av">${AVATAR[p.role] || '🙂'}</span>
      <span>
        <span class="t">${esc(p.name)}</span>
        <span class="d">${esc(ROLES[p.role]?.label || p.role)}</span>
        <span class="relbar"><i style="width:${p.rel}%;background:${relColour(p.rel)}"></i></span>
      </span>
      <span class="go">&rsaquo;</span>
    </button>`;
  }).join('');
}

function drawSheet() {
  if (!S.sheet) return;
  const L = S.life;
  const { kind, arg } = S.sheet;
  const title = $('sheetTitle');
  const hint = $('sheetHint');
  const body = $('sheetBody');
  $('sheetBack').classList.toggle('off', kind !== 'person' && kind !== 'focus');

  if (kind === 'people') {
    title.textContent = 'People';
    hint.textContent = 'Your coach decides your minutes. Your teammates decide whether you get the ball.';
    body.innerHTML = peopleListHtml();
  } else if (kind === 'person') {
    const p = personById(L, arg);
    if (!p) { openSheet('people'); return; }
    const acts = actionsForPerson(L, p);
    S.sheetActions = acts;
    title.textContent = p.name;
    hint.textContent = `${ROLES[p.role]?.label || p.role} · relationship ${p.rel}%`;
    body.innerHTML = acts.map(optRow).join('');
  } else if (kind === 'stats') {
    title.textContent = 'You';
    hint.textContent = 'The bar is where you are. The notch is as far as your genetics go.';
    body.innerHTML = statsSheetHtml();
  } else if (kind === 'vault') {
    title.textContent = 'Vault';
    hint.textContent = 'Every finished career, and a backup you can carry off this device.';
    body.innerHTML = vaultHtml();
    wireBackup();
    return;
  } else if (kind === 'badges') {
    title.textContent = 'Achievements';
    hint.textContent = '';
    body.innerHTML = badgesHtml();
  } else if (kind === 'focus') {
    const acts = focusActions(L);
    S.sheetActions = acts;
    title.textContent = 'Work one thing';
    hint.textContent = 'A second session on the same number is worth half, a third a fifth, a fourth nothing.';
    body.innerHTML = acts.map(focusRow).join('');
  } else {
    const cat = CATEGORIES.find((c) => c.id === kind);
    if (!cat) return;
    const acts = availableActions(L, kind);
    S.sheetActions = acts;
    title.textContent = cat.name;
    hint.textContent = cat.hint;
    const focusEntry = kind === 'train'
      ? `<button class="opt" data-focus="1" type="button">
           <span><span class="t">Work one thing</span>
           <span class="d">Pick a single attribute and grind it. Repeatable, up to a point.</span></span>
           <span class="go">&rsaquo;</span></button>`
      : '';
    body.innerHTML = focusEntry + (acts.length
      ? acts.map(optRow).join('')
      : (focusEntry ? '' : '<p class="note">Nothing here for you right now. That changes as your situation does.</p>'));
  }
  wireSheet();
}

function wireSheet() {
  const body = $('sheetBody');
  for (const el of body.querySelectorAll('[data-act]')) {
    el.onclick = () => {
      const a = S.sheetActions[Number(el.dataset.act)];
      if (!a) return;
      doAction(S.life, a, defaultRng);
      Progress.saveLife(S.life);
      render(true);
      drawSheet(); // gains and conditions have moved — redraw in place
    };
  }
  for (const el of body.querySelectorAll('[data-person]')) {
    el.onclick = () => openSheet('person', el.dataset.person);
  }
  const f = body.querySelector('[data-focus]');
  if (f) f.onclick = () => openSheet('focus');
}

// ---------------------------------------------------------------------------
// A question the year asks you
//
// Shown after the season resolves and before anything else, because the branch
// you pick lands in the same year's log. There is no dismiss: closing it would
// be a free re-roll on a decision that is supposed to cost something.
// ---------------------------------------------------------------------------
function openChoice() {
  const L = S.life;
  const c = L.choice;
  S.sheet = { kind: 'choice' };
  $('sheetBack').classList.add('off');
  $('sheetTitle').textContent = c.title;
  $('sheetHint').textContent = '';
  $('sheetBody').innerHTML = `
    <p class="choice-text">${esc(c.text)}</p>
    ${c.options.map((label, i) => `<button class="btn choice" data-opt="${i}" type="button">${esc(label)}</button>`).join('')}`;
  $('sheet').classList.remove('hidden');
  $('scrim').classList.remove('hidden');
  for (const el of $('sheetBody').querySelectorAll('[data-opt]')) {
    el.onclick = () => {
      const line = resolveChoice(L, c.id, Number(el.dataset.opt), defaultRng);
      // The outcome belongs to the year that asked, so it goes on that entry
      // rather than opening the next one with a consequence of the last.
      if (line && L.log.length) L.log[L.log.length - 1].events.push(line);
      L.choice = null;
      Progress.saveLife(L);
      closeSheet();
      render(true);
      if (L.pending) openDecision();
    };
  }
}

// ---------------------------------------------------------------------------
// Decisions — offers, transfers, and whether to declare
// ---------------------------------------------------------------------------
function offersHtml(transfer) {
  const L = S.life;
  const stars = starRating(L);
  return `<p class="note" style="margin-bottom:10px">${
    transfer
      ? 'You put your name in the portal. Here is what came back.'
      : `Four years of high school are done — you graduate a ${'★'.repeat(stars)}${'☆'.repeat(5 - stars)} recruit.`
  }</p>
  ${L.offers.map((o, i) => `
    <div class="offer${o.pro ? ' risky' : ''}">
      <div class="tier">${esc(o.tier)}</div>
      <h4>${esc(o.school)}</h4>
      <p>${esc(o.note)}</p>
      ${
        o.pro ? ''
        : `<p class="note">Development ${'▮'.repeat(Math.round(o.development * 3))} &middot;
             minutes are ${o.minutesBar >= 52 ? 'hard to come by' : o.minutesBar >= 46 ? 'earned' : 'there for you'}
             &middot; ${o.exposure >= 1.2 ? 'on television every week' : o.exposure >= 0.8 ? 'seen enough' : 'nobody is watching'}</p>`
      }
      <button class="btn primary" data-offer="${i}" type="button">${o.pro ? 'Declare' : 'Commit'}</button>
    </div>`).join('')}`;
}

function declareHtml() {
  const L = S.life;
  const proj = draftProjection(L);
  const forced = L.pending === 'forced';
  return `<div class="proj-banner ${proj.tone}">${esc(proj.label)}</div>
    <p class="note" style="margin:10px 0">${
      forced
        ? 'Four years of college are done. There is nothing left to go back to.'
        : 'Leave now and you sell the years of development you have not had yet. Stay and you bank the ability, but you are that much closer to finished when they draft you.'
    }</p>
    <p class="note" style="margin-bottom:12px">That is a projection, not a promise. Nobody knows what you top out at — including the people writing it.</p>
    <button class="btn primary" id="doDeclare" type="button">Declare for the draft</button>
    ${forced ? '' : '<button class="btn" id="doStay" type="button" style="margin-top:8px">Go back to school</button>'}`;
}

function openDecision() {
  const L = S.life;
  const transfer = L.pending === 'transfer';
  S.sheet = { kind: 'decision' };
  $('sheetBack').classList.add('off');
  $('sheetTitle').textContent =
    L.pending === 'decision' ? 'Where do you go?' : transfer ? 'Where to?' : 'Declare?';
  $('sheetHint').textContent = '';
  $('sheetBody').innerHTML =
    L.pending === 'decision' || transfer ? offersHtml(transfer) : declareHtml();
  $('sheet').classList.remove('hidden');
  $('scrim').classList.remove('hidden');

  for (const el of $('sheetBody').querySelectorAll('[data-offer]')) {
    el.onclick = () => {
      const offer = L.offers[Number(el.dataset.offer)];
      if (offer.pro) { runCareer(); return; }
      commit(L, offer, defaultRng);
      Progress.saveLife(L);
      closeSheet();
      render(true);
    };
  }
  const dec = $('doDeclare');
  if (dec) dec.onclick = () => runCareer();
  const stay = $('doStay');
  if (stay) {
    stay.onclick = () => { returnToSchool(L); Progress.saveLife(L); closeSheet(); render(); };
  }
}

// ---------------------------------------------------------------------------
// The pro career
// ---------------------------------------------------------------------------
function runCareer() {
  const L = S.life;
  const rng = defaultRng;
  // The engine that projects present ability onto the genetic ceiling lives in
  // life.js, so the Monte Carlo harness and the app hand the draft the same
  // build.
  declare(L);
  const b = proBuildFrom(L);
  const c = simulateCareer(b, rng);

  S.career = c;
  S.verdict = writeVerdict(c, b, rng);
  Progress.record(S.prog, c, b, {
    name: L.name, pos: positionFor(b.height).short, height: b.height,
    title: c.title.title, grade: potentialGrade(b), daily: false,
  });
  S.wonBadges = Progress.checkAchievements(S.prog, c, b);
  Progress.save(S.prog);
  Progress.saveLife(null);
  closeSheet();
  render(true);
}

function careerHtml() {
  const L = S.life;
  const c = S.career;
  const a = c.careerAverages;
  const line = (k, v) => `<div class="attr"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  return `${L.log.map(yearHtml).join('')}
  <article class="yr">
    <h3>The draft <span class="meta">age ${L.age}</span></h3>
    <div class="box">${c.drafted ? `Pick #${c.pick}` : 'Undrafted'} &mdash; ${esc(c.teams[0] || 'nobody')}</div>
    <div class="line">${esc(S.verdict.headline)}</div>
    <div class="attrs" style="margin-top:8px">
      ${c.madeLeague ? line('Draft OVR → peak', `${c.draftOvr} → ${c.peakRating}`) : ''}
      ${line('Seasons', c.seasons.length)}
      ${c.madeLeague ? line('Career averages', `${a.ppg} / ${a.rpg} / ${a.apg}`) : ''}
      ${line('All-stars', c.awards.allStars)}
      ${line('MVPs', c.awards.mvps)}
      ${line('Championships', c.awards.rings)}
      ${line('Hall of fame', c.hof ? 'Inducted' : '—')}
    </div>
    <p class="note" style="margin-top:10px">${esc(S.verdict.body)}</p>
  </article>
  ${
    (S.wonBadges || []).length
      ? `<article class="yr"><h3>Unlocked</h3><div class="badges">${S.wonBadges
          .map((b) => `<div class="badge on"><b>${esc(b.name)}</b><span>${esc(b.hint)}</span></div>`).join('')}</div></article>`
      : ''
  }
  <article class="yr">
    <h3>What you could not see</h3>
    <p class="note" style="margin-bottom:8px">These were driving everything and none of them were ever on screen.</p>
    <div class="attrs">
      ${MENTAL_KEYS.map((k) => `<div class="attr"><span class="k">${LABELS[k]}</span><span class="v">${L.mentals[k]}</span></div>`).join('')}
      <div class="attr"><span class="k">Talent</span><span class="v">${L.talent ?? '—'}</span></div>
    </div>
    <p class="note" style="margin-top:8px">Talent multiplied every hour you ever put in. Two players who
    made identical decisions for eight years do not arrive in the same place, and this is why.</p>
  </article>`;
}

// ---------------------------------------------------------------------------
// Sheet contents that are not actions
// ---------------------------------------------------------------------------
function statsSheetHtml() {
  const L = S.life;
  const t = titleFor(L.build);
  const mini = (k, v, col) => `<div class="attr"><span class="k">${k}</span><span class="v">${v}</span>
    <span class="bar"><span class="now" style="width:${clamp(v, 0, 100)}%;background:${col}"></span></span></div>`;
  return `<h3 class="sec">Basketball standing</h3>
    <div class="attrs">
      ${mini('Hype', Math.round(L.meters.hype), 'var(--hype)')}
      ${mini('Grades', Math.round(L.meters.grades), 'var(--grades)')}
      ${mini('Coach trust', Math.round(coachTrust(L)), 'var(--chem)')}
      ${mini('Team chemistry', Math.round(teamChemistry(L)), 'var(--good)')}
    </div>
    <h3 class="sec">Attributes — now vs your ceiling</h3>
    <div class="attrs">
      ${SKILL_KEYS.map((k) => {
        const now = Math.round(L.attrs[k]);
        const cap = L.build.skills[k];
        return `<div class="attr">
          <span class="k">${LABELS[k]}</span><span class="v">${now}</span>
          <span class="bar"><span class="now" style="width:${now}%"></span>
            <span class="cap" style="left:${clamp(cap, 0, 99)}%"></span></span></div>`;
      }).join('')}
    </div>
    <h3 class="sec">Body</h3>
    <div class="attrs">
      ${Object.keys(PHYSICALS).map((k) => `<div class="attr"><span class="k">${LABELS[k]}</span><span class="v">${L.physicals[k]}</span></div>`).join('')}
    </div>
    <h3 class="sec">Profile</h3>
    <p class="note">${esc(t.title)} &mdash; ${esc(t.flavor || '')}<br />
      Mentality ${L.build.mentality} &middot; ${
        L.build.mentality >= 62 ? 'score-first' : L.build.mentality <= 38 ? 'pass-first' : 'balanced'
      }${L.build.freakGene ? ` &middot; freak gene: ${LABELS[L.build.freakGene]}` : ''}</p>`;
}

function vaultHtml() {
  const p = S.prog;
  const best = Progress.bestCareers(p, 25);
  return `${
    best.length
      ? `<div class="scroll-x"><table>
          <thead><tr><th>#</th><th>Player</th><th>Pick</th><th>Peak</th><th>Yrs</th><th>AS</th><th>Rings</th><th>Score</th></tr></thead>
          <tbody>${best.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.name)}</td><td>${e.pick ?? '—'}</td>
            <td>${e.peak}</td><td>${e.seasons}</td><td>${e.allStars}</td><td>${e.rings}</td><td>${e.score}</td></tr>`).join('')}
          </tbody></table></div>`
      : '<p class="note">Nothing yet. Finish a life and it lands here.</p>'
  }
  <h3 class="sec">Back up your progress</h3>
  <p class="note">No account, no server. Copy this somewhere safe.</p>
  <textarea id="backupBox" class="backup" readonly rows="3">${esc(Progress.exportProgress(p))}</textarea>
  <div class="row2" style="margin-top:8px">
    <button class="btn" id="copyBackup" type="button">Copy backup</button>
    <button class="btn" id="pasteBackup" type="button">Restore</button>
  </div>
  <div id="restoreSlot"></div>`;
}

function badgesHtml() {
  const p = S.prog;
  const got = Object.keys(p.achievements).length;
  return `<p class="note">${got} of ${Progress.ACHIEVEMENTS.length} unlocked.</p>
    <div class="badges" style="margin-top:8px">${Progress.ACHIEVEMENTS.map((a) => {
      const on = !!p.achievements[a.id];
      return `<div class="badge ${on ? 'on' : ''}"><b>${esc(a.name)}</b><span>${esc(a.hint)}</span></div>`;
    }).join('')}</div>`;
}

function wireBackup() {
  $('copyBackup').onclick = async () => {
    const box = $('backupBox');
    try {
      await navigator.clipboard.writeText(box.value);
      $('copyBackup').textContent = 'Copied';
    } catch {
      box.removeAttribute('readonly');
      box.select();
      box.setSelectionRange(0, box.value.length);
      $('copyBackup').textContent = 'Selected — hold to copy';
    }
    setTimeout(() => ($('copyBackup').textContent = 'Copy backup'), 2200);
  };
  $('pasteBackup').onclick = () => {
    $('restoreSlot').innerHTML = `
      <p class="note" style="margin-top:12px">Paste a backup, then press Restore. This replaces what is on this device.</p>
      <textarea id="restoreBox" class="backup" rows="3" placeholder="Paste backup text"></textarea>
      <button class="btn primary" id="doRestore" type="button" style="margin-top:8px">Restore</button>
      <div id="restoreMsg" class="note"></div>`;
    $('doRestore').onclick = () => {
      const r = Progress.importProgress($('restoreBox').value);
      if (!r.ok) { $('restoreMsg').innerHTML = `<span style="color:var(--bad)">${esc(r.error)}</span>`; return; }
      S.prog = r.progress;
      Progress.save(S.prog);
      drawSheet();
    };
  };
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render(scrollToEnd = false) {
  const L = S.life;
  if (!L) return;
  const over = !!S.career;

  $('idcard').innerHTML = idcardHtml();
  $('bars').innerHTML = barsHtml();
  $('feed').innerHTML = feedHtml();

  // The + changes job depending on what the game is waiting for: play the year,
  // answer a decision, or start again once it is all over.
  const age = $('ageBtn');
  const waiting = !!L.pending || !!L.choice;
  age.classList.toggle('decide', waiting || over);
  age.querySelector('.lb').textContent = over ? 'New' : waiting ? 'Decide' : 'Age';
  age.querySelector('.plus').textContent = over ? '↻' : waiting ? '?' : '+';

  for (const el of document.querySelectorAll('[data-cat]')) {
    el.disabled = over || !!L.pending || !!L.choice;
    // A category holding something urgent says so, rather than making you find
    // out by opening all four.
    const cat = el.dataset.cat;
    const alert =
      (cat === 'school' && L.meters.grades < 40) ||
      (cat === 'train' && L.injured) ||
      (cat === 'people' && (coachTrust(L) < 28 || teamChemistry(L) < 30));
    el.dataset.alert = String(!over && !L.pending && !L.choice && !!alert);
  }

  if (scrollToEnd) requestAnimationFrame(() => { $('feed').scrollTop = $('feed').scrollHeight; });
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
for (const el of document.querySelectorAll('[data-cat]')) {
  el.onclick = () => openSheet(el.dataset.cat);
}
$('ageBtn').onclick = () => {
  if (S.career) { startLife(); return; }
  if (S.life.choice) { openChoice(); return; }
  if (S.life.pending) { openDecision(); return; }
  advanceYear(S.life, defaultRng);
  Progress.saveLife(S.life);
  closeSheet();
  render(true);
  if (S.life.choice) openChoice();
  else if (S.life.pending) openDecision();
};
$('sheetClose').onclick = () => {
  if (S.sheet?.kind === 'choice') return; // answering it is the only way out
  closeSheet();
};
$('scrim').onclick = () => {
  if (S.sheet?.kind !== 'decision' && S.sheet?.kind !== 'choice') closeSheet();
};
$('sheetBack').onclick = () => openSheet(S.sheet?.kind === 'focus' ? 'train' : 'people');

// The menu holds everything that is not a decision about this year.
$('menuBtn').onclick = () => {
  S.sheet = { kind: 'menu' };
  $('sheetBack').classList.add('off');
  $('sheetTitle').textContent = 'Hoop Life';
  $('sheetHint').textContent = '';
  $('sheetBody').innerHTML = `
    <button class="opt" id="mStats" type="button"><span><span class="t">You</span>
      <span class="d">Attributes, standing, and how far your genetics go.</span></span><span class="go">&rsaquo;</span></button>
    <button class="opt" id="mVault" type="button"><span><span class="t">Vault</span>
      <span class="d">Finished careers, and your backup.</span></span><span class="go">&rsaquo;</span></button>
    <button class="opt" id="mBadges" type="button"><span><span class="t">Achievements</span>
      <span class="d">What you have and have not done.</span></span><span class="go">&rsaquo;</span></button>
    <button class="opt" id="mNew" type="button"><span><span class="t">Start a new life</span>
      <span class="d">This one ends here. It is not saved.</span></span><span class="go">&rsaquo;</span></button>`;
  $('sheet').classList.remove('hidden');
  $('scrim').classList.remove('hidden');
  $('mStats').onclick = () => openSheet('stats');
  $('mVault').onclick = () => openSheet('vault');
  $('mBadges').onclick = () => openSheet('badges');
  $('mNew').onclick = startLife;
};

resumeOrStart();
</script>
<script>
  // Registered after load so it never competes with first paint.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
