<div class="wrap">
      <header>
        <h1>Build a Hooper<span>archetype build</span></h1>
        <div class="counter">
          BUILDS <b id="cnt">0</b><br />
          BEST GRADE <b id="best">&mdash;</b><br />
          STREAK <b id="lg">0</b>
        </div>
      </header>

      <nav class="modes nav">
        <button class="chip" id="navPlay" type="button" aria-pressed="true">Play</button>
        <button class="chip" id="navVault" type="button" aria-pressed="false">Vault</button>
        <button class="chip" id="navBadges" type="button" aria-pressed="false">Badges <b id="badgeCount">0/20</b></button>
      </nav>

      <div id="playView">
        <div class="modes">
          <button class="chip" id="quick" type="button" aria-pressed="false">Quick roll</button>
          <button class="chip" id="daily" type="button" aria-pressed="false">Daily seed</button>
        </div>

      <div class="install-hint hidden" id="installHint"></div>
        <div class="prog" id="prog"></div>
      <div id="freakSlot"></div>

      <div class="stage" id="stage"></div>

      <div class="actions">
        <button class="b-roll" id="roll" type="button">Roll height</button>
        <button class="b-alt" id="rr" type="button" disabled>
          Reroll <span class="rr-count" id="rrn"></span>
        </button>
      </div>

        <div class="stats" id="stats"></div>
        <div id="ovrSlot"></div>
        <div id="car"></div>
      </div>

      <div id="vaultView" class="hidden"></div>
      <div id="badgesView" class="hidden"></div>

/* Build a Hooper — arena scoreboard.
   Deliberately single-theme: an amber LED board on dark wood. It does not
   invert into a light theme, because a scoreboard doesn't. color-scheme keeps
   native controls and scrollbars on the same side of that choice.

   Type: Anton for display, Archivo for UI text, JetBrains Mono for every
   number — anything that lines up in a column is tabular. */

:root {
  color-scheme: dark;

  --wood: #150f0b;
  --wood2: #221811;
  --wood3: #2e2117;
  --led: #ffa92b;
  --led-dim: #8a5e1e;
  --hot: #ffe9b8;
  --line: #f2e6d0;

  /* Rarity ramp — grey, green, blue, purple, gold, red. */
  --t0: #6b6257;
  --t1: #4fd07a;
  --t2: #4fa8ff;
  --t3: #b77bff;
  --t4: #ffc53d;
  --t5: #ff4f4f;

  --bad: #c97a7a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--wood);
  /* Faint vertical rule, like light through a slatted arena ceiling. */
  background-image: repeating-linear-gradient(90deg, rgba(255, 169, 43, 0.022) 0 2px, transparent 2px 7px);
  color: var(--line);
  font-family: 'Archivo', system-ui, sans-serif;
  min-height: 100vh;
  padding: 18px 14px 60px;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 640px; margin: 0 auto; }

/* ---------- header ---------- */
header {
  display: flex; align-items: flex-end; justify-content: space-between;
  border-bottom: 2px solid var(--led-dim); padding-bottom: 9px; margin-bottom: 12px;
  flex-wrap: wrap; gap: 8px;
}
h1 {
  font-family: 'Anton', 'Arial Narrow', sans-serif;
  font-size: clamp(24px, 6.2vw, 36px); letter-spacing: 0.02em; color: var(--led);
  line-height: 0.9; text-transform: uppercase;
}
h1 span { color: var(--line); display: block; font-size: 0.4em; letter-spacing: 0.3em; margin-top: 5px; }
.counter {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--led-dim);
  letter-spacing: 0.12em; text-align: right; line-height: 1.75; font-variant-numeric: tabular-nums;
}
.counter b { color: var(--led); font-weight: 700; }

/* ---------- mode chips ---------- */
.modes { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.chip {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; padding: 6px 11px; background: transparent;
  border: 1px solid var(--wood3); color: var(--led-dim); cursor: pointer;
  transition: 0.15s; flex: none; min-width: 0;
}
.chip:hover { border-color: var(--led-dim); color: var(--led); }
.chip[aria-pressed='true'] { border-color: var(--led); color: var(--wood); background: var(--led); font-weight: 700; }
.chip.plain { cursor: default; }
.chip.plain:hover { border-color: var(--wood3); color: var(--led-dim); }

/* ---------- progress pips ---------- */
.prog { display: flex; gap: 3px; margin-bottom: 13px; }
.pip { flex: 1; height: 3px; background: rgba(255, 169, 43, 0.13); }
.pip.done { background: var(--led-dim); }
.pip.now { background: var(--led); }

/* ---------- the stage ---------- */
.stage {
  background: var(--wood2); border: 1px solid var(--wood3); border-left: 3px solid var(--led);
  padding: 20px 18px; margin-bottom: 13px; text-align: center; min-height: 158px;
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
}
.stage.leg {
  border-left-color: var(--t4);
  background: linear-gradient(180deg, #2a2210, var(--wood2));
  animation: glow 1.6s infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 rgba(255, 197, 61, 0); }
  50% { box-shadow: 0 0 26px rgba(255, 197, 61, 0.22); }
}
.stage-lbl {
  font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--led-dim); font-weight: 600;
}
.stage-num {
  font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: clamp(50px, 14vw, 78px);
  color: var(--hot); line-height: 0.86; font-variant-numeric: tabular-nums;
}
.stage-num.rolling { color: var(--led-dim); }
.stage-exp { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--led-dim); letter-spacing: 0.08em; }
.stage-exp b { color: var(--line); }
.stage-dev { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; min-height: 19px; }
.stage-tier { font-family: 'Anton', sans-serif; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; min-height: 17px; }
.stage-sub { font-size: 12.5px; color: var(--led-dim); line-height: 1.55; max-width: 430px; margin: 0 auto; }
.stage-sub em { font-style: normal; color: var(--t0); }

.arch-tier { font-family: 'Anton', sans-serif; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; }
.arch-name {
  font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: clamp(28px, 7.5vw, 44px);
  line-height: 1; letter-spacing: 0.01em; margin: 4px 0; text-wrap: balance;
}
.gifts { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.75; color: var(--led-dim); margin-top: 7px; }
.gifts b { color: var(--t1); font-weight: 400; }
.gifts i { color: var(--bad); font-style: normal; }

/* ---------- mentality axis ---------- */
.axis { max-width: 300px; margin: 8px auto 0; }
.axis-bar { height: 5px; background: linear-gradient(90deg, var(--t2), var(--wood3), var(--t4)); position: relative; }
.axis-dot { position: absolute; top: -4px; width: 3px; height: 13px; background: var(--hot); }
.axis-lbl {
  display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--led-dim); letter-spacing: 0.1em; margin-top: 5px;
}

/* ---------- the ledger ---------- */
.stats { border: 1px solid var(--wood3); background: var(--wood2); }
.stats:empty { display: none; }
.row {
  display: grid; grid-template-columns: 104px 38px 1fr 54px; gap: 9px; align-items: center;
  padding: 7px 13px; border-bottom: 1px solid rgba(255, 169, 43, 0.07); animation: slide 0.3s ease;
}
@keyframes slide { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.row:last-child { border-bottom: none; }
.nm { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--led-dim); font-weight: 600; }
.nm em { font-style: normal; color: var(--t4); }
.vl { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: rgba(255, 255, 255, 0.05); position: relative; overflow: hidden; }
.fill { height: 100%; }
.exp-tick { position: absolute; top: -3px; width: 1px; height: 12px; background: var(--line); opacity: 0.45; }
.dev { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-align: right; color: var(--t0); font-variant-numeric: tabular-nums; }
.dev.up { color: var(--led); }
.dev.down { color: #7a5c5c; }
.sect {
  font-family: 'Anton', sans-serif; font-size: 10px; letter-spacing: 0.26em; color: var(--led-dim);
  padding: 9px 13px 5px; text-transform: uppercase; border-bottom: 1px solid rgba(255, 169, 43, 0.07);
}

/* ---------- overall / title ---------- */
.overall {
  display: flex; justify-content: space-between; align-items: center; background: var(--wood3);
  padding: 13px 17px; margin-top: 12px; flex-wrap: wrap; gap: 10px;
}
.ovr-n { font-family: 'Anton', sans-serif; font-size: 36px; color: var(--hot); line-height: 0.9; font-variant-numeric: tabular-nums; }
.ovr-l { font-size: 9.5px; letter-spacing: 0.22em; color: var(--led-dim); text-transform: uppercase; }
.ovr-side { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--led-dim); letter-spacing: 0.1em; line-height: 1.7; }
.pos-badge { font-family: 'Anton', sans-serif; font-size: 13px; letter-spacing: 0.2em; color: var(--wood); background: var(--led); padding: 6px 12px; }
.title-bar { background: var(--wood3); border-left: 3px solid var(--led); padding: 11px 16px; margin-top: 10px; }
.title-bar .tt { font-family: 'Anton', sans-serif; font-size: 19px; letter-spacing: 0.05em; }
.title-bar .ts { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: var(--led-dim); margin-top: 3px; }

.freak {
  margin-bottom: 12px; padding: 10px 15px; background: #2a0d0d; border-left: 3px solid var(--t5);
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #ff9c9c; animation: pulse 1.4s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }

/* ---------- actions ---------- */
.actions { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; }
button {
  font-family: 'Anton', 'Arial Narrow', sans-serif; letter-spacing: 0.13em; font-size: 15px;
  text-transform: uppercase; border: none; padding: 15px 18px; cursor: pointer;
  flex: 1; min-width: 118px; transition: 0.15s;
}
.b-roll { background: var(--led); color: var(--wood); }
.b-roll:hover:not(:disabled) { background: var(--hot); }
.b-alt { background: transparent; color: var(--led); border: 1px solid var(--led-dim); }
.b-alt:hover:not(:disabled) { border-color: var(--led); color: var(--hot); }
button:disabled { opacity: 0.28; cursor: not-allowed; }
button:focus-visible, .chip:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
.rr-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

/* ---------- career ---------- */
.career { margin-top: 15px; border: 1px solid var(--wood3); background: var(--wood2); padding: 17px; }
.career h2 {
  font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: 0.2em; color: var(--led);

// Seedable RNG. Everything in the engine draws from an injected `rng` object so
// the daily seed and the Monte Carlo harness are reproducible.

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// An RNG handle: .random() plus the derived distributions the engine needs.
function makeRng(source) {
  const random = source || Math.random;
  let spare = null;
  const api = {
    random,
    // Box-Muller, cached spare.
    gauss(mean = 0, sd = 1) {
      if (spare !== null) {
        const v = spare;
        spare = null;
        return mean + sd * v;
      }
      let u = 0;
      let v = 0;
      let s = 0;
      do {
        u = random() * 2 - 1;
        v = random() * 2 - 1;
        s = u * u + v * v;
      } while (s >= 1 || s === 0);
      const mul = Math.sqrt((-2 * Math.log(s)) / s);
      spare = v * mul;
      return mean + sd * u * mul;
    },
    int(n) {
      return Math.floor(random() * n);
    },
    pick(arr) {
      return arr[Math.floor(random() * arr.length)];
    },
    chance(p) {
      return random() < p;
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
  };
  return api;
}

function seededRng(seedText) {

// Normal tail probabilities.
//
// The roll curve needs P(Z > t) accurate far out in the tail — a Mythic pull is
// around 1 in a million, and the odds line quotes it — so this needs small
// RELATIVE error at large t, not just small absolute error. The usual
// Abramowitz-Stegun 7.1.26 polynomial is ~1e-7 absolute, which is worthless
// once the true value is 1e-9. This is the Chebyshev erfc from Numerical
// Recipes 3rd ed., which holds relative accuracy across the whole range.

const COF = [
  -1.3026537197817094, 6.4196979235649026e-1, 1.9476473204185836e-2,
  -9.561514786808631e-3, -9.46595344482036e-4, 3.66839497852761e-4,
  4.2523324806907e-5, -2.0278578112534e-5, -1.624290004647e-6,
  1.30365583558e-6, 1.5626441722e-8, -8.5238095915e-8,
  6.529054439e-9, 5.059343495e-9, -9.91364156e-10,
  -2.27365122e-10, 9.6467911e-11, 2.394038e-12,
  -6.886027e-12, 8.94487e-13, 3.13092e-13,
  -1.12708e-13, 3.81e-16, 7.106e-15,
];

function erfc(x) {
  const z = Math.abs(x);
  const t = 2 / (2 + z);
  const ty = 4 * t - 2;
  let d = 0;
  let dd = 0;
  for (let j = COF.length - 1; j > 0; j--) {
    const tmp = d;
    d = ty * d - dd + COF[j];
    dd = tmp;
  }
  const ans = t * Math.exp(-z * z + 0.5 * (COF[0] + ty * d) - dd);
  return x >= 0 ? ans : 2 - ans;
}

// P(Z > t) for standard normal Z.
const normalTail = (t) => 0.5 * erfc(t / Math.SQRT2);

// Inverse of normalTail: the t with P(Z > t) = p. Newton refinement on top of
// the Acklam-style rational start, so the seeded sampler can be pure inverse
// transform and consume exactly one uniform per magnitude.
function normalTailInv(p) {
  if (p <= 0) return Infinity;
  if (p >= 1) return -Infinity;
  // Rational approximation for the normal quantile (Wichura-style tails).
  const q = p < 0.5 ? p : 1 - p;
  const r = Math.sqrt(-2 * Math.log(q));
  let t =
    r -
    (2.30753 + 0.27061 * r) / (1 + (0.99229 + 0.04481 * r) * r);
  // Two Newton steps against the accurate tail: plenty for double precision.
  for (let i = 0; i < 3; i++) {
    const err = normalTail(t) - q;
    const pdf = Math.exp(-0.5 * t * t) / Math.sqrt(2 * Math.PI);
    if (pdf < 1e-300) break;
    t += err / pdf;
  }
  return p < 0.5 ? t : -t;
}

function rollArchetype(rng) {
  const r = rng.random();
  let acc = 0;
  for (const t of ARCHETYPE_TIERS) {
    acc += t.chance;
    if (r < acc) {
      if (t.tier === 'None') return null;
      const a = rng.pick(ROLLED_ARCHETYPES[t.tier]);
      return { ...a, tier: t.tier, color: t.color };
    }
  }
  return null;
}

// Resolve every gift mechanism for one attribute key.
// Returned `floor` is relative to the GIFTED expectation, because that is what
// rollStat is handed — the spec's floor is relative to the natural one.
function applyGift(archetype, key) {
  if (!archetype) return { boost: 0, sigmaMult: 1, floor: null };
  const boost = (archetype.boost?.[key] || 0) - (archetype.cost?.[key] || 0);
  const sigmaMult = archetype.sigmaMult?.[key] ?? 1;

  const specific = archetype.floor?.[key];
  const all = archetype.floor?.ALL;
  let floorNatural = null;
  if (specific !== undefined && all !== undefined) floorNatural = Math.max(specific, all);
  else if (specific !== undefined) floorNatural = specific;
  else if (all !== undefined) floorNatural = all;

  return {
    boost,
    sigmaMult,
    floor: floorNatural === null ? null : floorNatural - boost,
  };
}

// ---------------------------------------------------------------------------
// 5B — DERIVED ARCHETYPES, for the 70% who rolled nothing.
// ---------------------------------------------------------------------------

// Thresholds are percentiles of the rolled population, not round numbers.
// Measured medians: scoring 42, passing 41, defense 40, IQ 50. Anything phrased
// as "weak scoring" has to sit below 42 to mean weak, and a minimum-skill test
// can never fire at all, because the 25 floor puts a 25 on almost every build.
function deriveArchetype(b) {
  const s = b.skills;
  const m = b.mentals;
  const scoring = (s.three + s.midrange + s.finishing + s.dunk) / 4;
  const passing = (s.playmaking + s.handles) / 2;
  const defense = (s.perimeterD + s.interiorD + s.block) / 3;
  const skillVals = Object.values(s).sort((x, y) => x - y);
  const best = skillVals[skillVals.length - 1];
  // "No weak spots" needs two tests, not one. The single worst skill tests
  // nothing but the 25 floor, and the fourth-worst alone still lets a build with
  // three floored skills through. Genuinely hole-free is rare here (~1% of
  // balanced high-IQ builds) and The Engine should be rare to match.
  const fourthLowest = skillVals[3];
  const weakSpots = skillVals.filter((v) => v < 35).length;

  // Failure states first — a diagnosis outranks a description.
  if (b.mentality >= 64 && scoring <= 38) {
    return {
      title: 'The Chucker',
      tier: 'Derived',
      failure: true,
      color: '#ff6b6b',
      flavor: 'Wanted every shot. Could not make them.',
    };
  }
  if (b.mentality <= 36 && scoring >= 58) {
    return {
      title: 'The Ghost',
      tier: 'Derived',
      failure: true,
      color: '#ff6b6b',
      flavor: 'Had it the whole time and would not use it.',
    };
  }
  if (b.mentality <= 45 && passing >= 58) {
    return {
      title: 'The Conductor',
      tier: 'Derived',
      color: '#4c8dff',
      flavor: 'The offense runs through him and it hums.',
    };
  }
  if (defense >= 55 && scoring <= 45) {
    return {
      title: 'Glue',
      tier: 'Derived',
      color: '#3fb950',
      flavor: 'Does the parts of the job nobody claps for.',
    };
  }
  if (b.mentality >= 40 && b.mentality <= 62 && m.bballIQ >= 58 && fourthLowest >= 36 && weakSpots <= 3) {
    return {
      title: 'The Engine',
      tier: 'Derived',
      color: '#3fb950',
      flavor: 'Nothing to attack, nothing to scheme against. Never off the floor.',
    };
  }
  if (best < 75) {
    return {
      title: 'Rotation Guy',
      tier: 'Derived',
      color: '#8b93a1',
      flavor: 'Eight to twelve honest minutes a night.',
    };
  }
  return {
    title: 'Rotation Guy',
    tier: 'Derived',
    color: '#8b93a1',
    flavor: 'Useful. Never the reason you bought a ticket.',
  };
}

function titleFor(b) {
  return b.archetype ? b.archetype : deriveArchetype(b);
}
