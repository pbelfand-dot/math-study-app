<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hoop Life</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M2 16h28M16 2v28M6 6c8 5 8 15 0 20M26 6c-8 5-8 15 0 20' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="menu" id="menuBtn" type="button" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="brand">HOOP<b>LIFE</b></div>
        <div class="menu spacer" aria-hidden="true"></div>
      </header>

      <div class="idcard" id="idcard"></div>

      <main class="feed" id="feed"></main>

      <div class="dock-wrap">
        <nav class="dock" id="dock">
          <button class="dock-btn" data-cat="train" type="button">
            <span class="ic">🏀</span><span class="lb">Train</span>
          </button>
          <button class="dock-btn" data-cat="school" type="button">
            <span class="ic">🎓</span><span class="lb">School</span>
          </button>
          <button class="age" id="ageBtn" type="button">
            <span class="plus">+</span><span class="lb">Age</span>
          </button>
          <button class="dock-btn" data-cat="people" type="button">
            <span class="ic">👥</span><span class="lb">People</span>
          </button>
          <button class="dock-btn" data-cat="life" type="button">
            <span class="ic">💵</span><span class="lb">Life</span>
          </button>
        </nav>
        <div class="bars" id="bars"></div>
      </div>
    </div>

    <div class="scrim hidden" id="scrim"></div>
    <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-label="Options">
      <div class="sheet-head">
        <button class="back off" id="sheetBack" type="button" aria-label="Back">&lsaquo;</button>
        <h2 id="sheetTitle"></h2>
        <button class="close" id="sheetClose" type="button" aria-label="Close">&times;</button>
      </div>
      <p class="sheet-hint" id="sheetHint"></p>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
